<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Sorter v6.3 — MediaPipe Tasks Vision + @vladmandic/human (iPad M1+)</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>
  <script type="module">
    import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
    window.__MP_VISION__ = { FilesetResolver, FaceLandmarker };
  </script>
  <style>
    :root {
      --bg: #eef1f5;
      --card: #ffffff;
      --text: #18202c;
      --muted: #5c6778;
      --accent: #0f62fe;
      --accent-soft: #e6efff;
      --danger: #c62828;
      --warn: #b45309;
      --border: #dfe4ec;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    h1 { font-size: 17px; margin: 0; font-weight: 700; }
    .badge-model {
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 999px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    input[type="file"] { font-size: 13px; width: 100%; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { background: #aeb8c7; cursor: not-allowed; }
    .btn-ghost {
      background: #f2f4f8;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sm { padding: 5px 8px; font-size: 11.5px; border-radius: 7px; }
    .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
    .meta-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-row label { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
    input[type="range"] { width: 115px; }
    #status { font-size: 12.5px; font-weight: 600; color: var(--accent); }
    #status.err { color: var(--danger); }

    /* Lưới 2 cột: mỗi người chiếm 1/2 chiều rộng màn hình */
    .people-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: start;
    }
    .person-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      min-width: 0;
    }
    .person-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid var(--accent);
    }
    .name-compact {
      width: 72px;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .cnt-pill {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }
    .merge-mini {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .merge-mini select {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fafbfc;
    }
    .faces-subgrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }
    .face-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 7px;
      overflow: hidden;
      background: #e9edf3;
    }
    .face-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }
    .del-x {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(20, 24, 30, 0.72);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }
    .strike-tag {
      position: absolute;
      bottom: 2px;
      left: 2px;
      font-size: 9.5px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 1px 4px;
      border-radius: 4px;
      pointer-events: none;
    }

    .unsure-panel {
      margin-top: 14px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .unsure-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .unsure-title { font-size: 13.5px; font-weight: 700; color: var(--warn); }
    .unsure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 6px;
    }

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12, 16, 22, 0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-box {
      background: #fff;
      color: var(--text);
      border-radius: 14px;
      padding: 12px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-box img {
      width: 100%;
      max-height: 52vh;
      object-fit: contain;
      border-radius: 10px;
      background: #111;
    }
    .modal-info { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .modal-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title-row">
      <h1>Face Sorter — iPad M1+</h1>
      <span class="badge-model">MediaPipe Tasks Vision + Human (BlazeFace + FaceRes 1024D)</span>
    </div>
    <div class="controls-grid">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <button id="runBtn" class="btn" disabled>Đang tải AI...</button>
    </div>
    <div class="meta-row">
      <label>Ngưỡng Cosine (v6.3): <span id="simLabel">0.72</span>
        <input type="range" id="simThreshold" min="0.50" max="0.92" step="0.01" value="0.72" />
      </label>
      <label>Góc nghiêng tối đa: <span id="yawLabel">36°</span>
        <input type="range" id="maxYaw" min="20" max="55" step="1" value="36" />
      </label>
      <span id="status">Đang tải MediaPipe GPU & Human FaceRes...</span>
    </div>
  </div>

  <div id="peopleGrid" class="people-grid"></div>

  <div class="unsure-panel">
    <div class="unsure-head">
      <div class="unsure-title">Unsure (<span id="unsureCount">0</span>) — Mặt bị xoá ≥ 3 lần hoặc chưa nhận diện rõ</div>
      <button id="recheckUnsureBtn" class="btn btn-sm btn-ghost">Kiểm tra lại bằng mô hình khác</button>
    </div>
    <div id="unsureGrid" class="unsure-grid"></div>
  </div>

  <div id="modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img id="modalImg" src="" alt="" />
      <div id="modalInfo" class="modal-info"></div>
      <div class="modal-actions">
        <select id="moveTargetSelect"></select>
        <button id="moveTargetBtn" class="btn btn-sm">Chuyển người</button>
        <button id="removeStrikeBtn" class="btn btn-sm btn-danger">Xoá khỏi người (loại trừ)</button>
        <button class="btn btn-sm btn-ghost" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  </div>

  <script type="module">
    const MP_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    const MP_WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

    const fileInput = document.getElementById("fileInput");
    const runBtn = document.getElementById("runBtn");
    const statusEl = document.getElementById("status");
    const simThresholdEl = document.getElementById("simThreshold");
    const simLabel = document.getElementById("simLabel");
    const maxYawEl = document.getElementById("maxYaw");
    const yawLabel = document.getElementById("yawLabel");
    const peopleGrid = document.getElementById("peopleGrid");
    const unsureGrid = document.getElementById("unsureGrid");
    const unsureCountEl = document.getElementById("unsureCount");
    const recheckUnsureBtn = document.getElementById("recheckUnsureBtn");

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const modalInfo = document.getElementById("modalInfo");
    const moveTargetSelect = document.getElementById("moveTargetSelect");
    const moveTargetBtn = document.getElementById("moveTargetBtn");
    const removeStrikeBtn = document.getElementById("removeStrikeBtn");

    let human = null;
    let faceLandmarker = null;
    let allFaces = [];
    let people = [];
    let unsureFaces = [];
    let modalCtx = null;

    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.className = isErr ? "err" : "";
    }

    async function initModels() {
      try {
        let wait = 0;
        while ((!window.Human || !window.__MP_VISION__) && wait < 100) {
          await new Promise(r => setTimeout(r, 100));
          wait++;
        }
        if (!window.Human || !window.__MP_VISION__) {
          throw new Error("Không tải được thư viện Human hoặc MediaPipe.");
        }

        // Khởi tạo @vladmandic/human với BlazeFace + FaceMesh + FaceRes (embedding 1024 chiều mới hơn face-api 128D)
        human = new window.Human.Human({
          backend: "webgl",
          modelBasePath: "https://cdn.jsdelivr.net/npm/@vladmandic/human/models/",
          cacheSensitivity: 0,
          face: {
            enabled: true,
            detector: { enabled: true, maxDetected: 15, minConfidence: 0.55, rotation: true },
            mesh: { enabled: true },
            iris: { enabled: false },
            description: { enabled: true }, // FaceRes 1024-dim descriptor
            emotion: { enabled: false },
            antispoof: { enabled: false },
            liveness: { enabled: false }
          },
          body: { enabled: false },
          hand: { enabled: false },
          object: { enabled: false },
          gesture: { enabled: false }
        });
        await human.load();

        // Khởi tạo MediaPipe Tasks Vision FaceLandmarker (GPU) để đo chính xác góc yaw 3D và tách mặt phụ
        const { FilesetResolver, FaceLandmarker } = window.__MP_VISION__;
        const vision = await FilesetResolver.forVisionTasks(MP_WASM_URL);
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MP_MODEL_URL, delegate: "GPU" },
          runningMode: "IMAGE",
          numFaces: 15,
          outputFacialTransformationMatrixes: true
        });

        runBtn.disabled = false;
        runBtn.textContent = "Quét (10-20 ảnh)";
        setStatus("Sẵn sàng trên iPad M1+ (MediaPipe GPU + Human FaceRes 1024D).");
      } catch (err) {
        setStatus("Lỗi tải mô hình: " + err.message, true);
      }
    }

    initModels();

    simThresholdEl.addEventListener("input", () => {
      simLabel.textContent = parseFloat(simThresholdEl.value).toFixed(2);
      if (allFaces.length > 0) clusterExclusive();
    });

    maxYawEl.addEventListener("input", () => {
      yawLabel.textContent = `${maxYawEl.value}°`;
      if (allFaces.length > 0) clusterExclusive();
    });

    function estimateYawDegFromMatrix(matrixData) {
      if (!matrixData || matrixData.length < 16) return 0;
      const z0 = matrixData[8];
      const z2 = matrixData[10];
      return Math.abs((Math.atan2(z0, z2) * 180) / Math.PI);
    }

    function fileToCanvas(file, maxDim = 1500) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const c = document.createElement("canvas");
          c.width = width;
          c.height = height;
          c.getContext("2d").drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);
          resolve(c);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Lỗi đọc ảnh"));
        };
        img.src = url;
      });
    }

    // Crop chặt không lấn sang mặt người khác trong collage
    function cropTightNonOverlapping(sourceCanvas, box, allBoxes, outSize = 240) {
      let pad = Math.round(Math.max(box.width, box.height) * 0.14);

      for (const other of allBoxes) {
        if (other === box) continue;
        const dx = Math.max(other.x - (box.x + box.width), box.x - (other.x + other.width), 0);
        const dy = Math.max(other.y - (box.y + box.height), box.y - (other.y + other.height), 0);
        const dist = Math.hypot(dx, dy);
        if (dist < pad * 2) {
          pad = Math.max(2, Math.floor(dist / 2) - 2);
        }
      }

      const x = Math.max(0, Math.round(box.x - pad));
      const y = Math.max(0, Math.round(box.y - pad));
      const w = Math.min(sourceCanvas.width - x, Math.round(box.width + pad * 2));
      const h = Math.min(sourceCanvas.height - y, Math.round(box.height + pad * 2));

      const out = document.createElement("canvas");
      out.width = outSize;
      out.height = outSize;
      out.getContext("2d").drawImage(sourceCanvas, x, y, w, h, 0, 0, outSize, outSize);
      const dataUrl = out.toDataURL("image/jpeg", 0.92);
      out.width = 0;
      out.height = 0;
      return dataUrl;
    }

    // Cosine similarity chuẩn [-1..1] (chuẩn hóa L2 từng vector trước khi tính dot product)
    function l2Normalize(vec) {
      let norm = 0;
      for (let i = 0; i < vec.length; i++) norm += vec[i] * vec[i];
      norm = Math.sqrt(norm) || 1;
      const out = new Float32Array(vec.length);
      for (let i = 0; i < vec.length; i++) out[i] = vec[i] / norm;
      return out;
    }

    function cosineSimilarity(a, b) {
      if (!a || !b || a.length !== b.length) return -1;
      const na = l2Normalize(a);
      const nb = l2Normalize(b);
      let dot = 0;
      for (let i = 0; i < na.length; i++) dot += na[i] * nb[i];
      return Math.max(-1, Math.min(1, dot));
    }

    function calcNormalizedCentroid(vectors) {
      const len = vectors[0].length;
      const sum = new Float32Array(len);
      for (const v of vectors) {
        for (let i = 0; i < len; i++) sum[i] += v[i];
      }
      let norm = 0;
      for (let i = 0; i < len; i++) {
        sum[i] /= vectors.length;
        norm += sum[i] * sum[i];
      }
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < len; i++) sum[i] /= norm;
      return sum;
    }

    runBtn.addEventListener("click", async () => {
      const files = Array.from(fileInput.files || []);
      if (!files.length) {
        setStatus("Hãy chọn 10-20 ảnh trước.", true);
        return;
      }

      runBtn.disabled = true;
      allFaces = [];
      people = [];
      unsureFaces = [];
      let idSeq = 0;

      for (let i = 0; i < files.length; i++) {
        setStatus(`Đang quét ảnh ${i + 1}/${files.length}...`);
        await new Promise(r => setTimeout(r, 10));

        try {
          const canvas = await fileToCanvas(files[i], 1500);
          const baseName = files[i].name.replace(/\.[^.]+$/, "");

          // 1) MediaPipe Tasks Vision dò landmarks 3D & góc yaw
          const mpRes = faceLandmarker ? faceLandmarker.detect(canvas) : null;
          const mpFaces = [];
          if (mpRes && mpRes.faceLandmarks) {
            mpRes.faceLandmarks.forEach((lms, k) => {
              let minX = 1, minY = 1, maxX = 0, maxY = 0;
              for (const pt of lms) {
                if (pt.x < minX) minX = pt.x;
                if (pt.y < minY) minY = pt.y;
                if (pt.x > maxX) maxX = pt.x;
                if (pt.y > maxY) maxY = pt.y;
              }
              const yaw = mpRes.facialTransformationMatrixes?.[k]
                ? estimateYawDegFromMatrix(mpRes.facialTransformationMatrixes[k].data)
                : 0;
              mpFaces.push({
                cx: ((minX + maxX) / 2) * canvas.width,
                cy: ((minY + maxY) / 2) * canvas.height,
                box: {
                  x: minX * canvas.width,
                  y: minY * canvas.height,
                  width: Math.max(20, (maxX - minX) * canvas.width),
                  height: Math.max(20, (maxY - minY) * canvas.height)
                },
                yaw
              });
            });
          }

          // 2) @vladmandic/human (BlazeFace + FaceRes 1024D)
          const hRes = await human.detect(canvas);
          const validHumanFaces = (hRes.face || []).filter(
            f => f.box && f.box[2] >= 40 && f.box[3] >= 40
          );

          if (!validHumanFaces.length && mpFaces.length) {
            // MediaPipe thấy mặt nhưng Human chưa bắt được -> đưa vào Unsure
            const allMpBoxes = mpFaces.map(m => m.box);
            mpFaces.forEach((m, k) => {
              idSeq++;
              unsureFaces.push({
                id: `f_${idSeq}`,
                url: cropTightNonOverlapping(canvas, m.box, allMpBoxes, 240),
                fileName: `${baseName}_mp_${k + 1}.jpg`,
                embedding: null,
                score: 0.45,
                yaw: m.yaw,
                strikes: 0,
                excludedIds: new Set(),
                reason: "Chưa trích xuất được FaceRes"
              });
            });
          } else {
            const boxes = validHumanFaces.map(f => ({
              x: f.box[0],
              y: f.box[1],
              width: f.box[2],
              height: f.box[3]
            }));

            validHumanFaces.forEach((f, idx) => {
              const box = boxes[idx];
              const cx = box.x + box.width / 2;
              const cy = box.y + box.height / 2;

              // Ghép góc yaw từ MediaPipe gần tâm mặt nhất, dự phòng góc từ Human rotation
              let yaw = f.rotation?.angle?.yaw ? Math.abs((f.rotation.angle.yaw * 180) / Math.PI) : 0;
              let bestDist = Infinity;
              for (const m of mpFaces) {
                const d = Math.hypot(m.cx - cx, m.cy - cy);
                if (d < bestDist && d < Math.max(box.width, box.height)) {
                  bestDist = d;
                  yaw = m.yaw;
                }
              }

              idSeq++;
              const faceUrl = cropTightNonOverlapping(canvas, box, boxes, 240);
              allFaces.push({
                id: `f_${idSeq}`,
                url: faceUrl,
                fileName: `${baseName}_m${idx + 1}.jpg`,
                embedding: f.embedding && f.embedding.length ? l2Normalize(f.embedding) : null,
                score: f.faceScore || f.boxScore || 0.5,
                yaw,
                strikes: 0,
                excludedIds: new Set(),
                reason: ""
              });
            });
          }

          canvas.width = 0;
          canvas.height = 0;
        } catch (err) {
          console.warn(err);
        }
      }

      clusterExclusive();
      runBtn.disabled = false;
      setStatus(`Xong ${files.length} ảnh • ${people.length} người • ${unsureFaces.length} unsure.`);
    });

    function clusterExclusive() {
      const simTh = parseFloat(simThresholdEl.value);
      const maxYaw = parseFloat(maxYawEl.value);

      const permanentUnsure = unsureFaces.filter(f => f.strikes >= 3);
      unsureFaces = [...permanentUnsure];
      people = [];

      const candidates = [];
      for (const f of allFaces) {
        if (f.strikes >= 3) continue;
        if (!f.embedding) {
          unsureFaces.push({ ...f, reason: "Thiếu embedding" });
          continue;
        }
        if (f.yaw > maxYaw) {
          unsureFaces.push({ ...f, reason: `Nghiêng ~${Math.round(f.yaw)}° > ${maxYaw}°` });
          continue;
        }
        candidates.push(f);
      }

      candidates.sort((a, b) => b.score - a.score);
      const used = new Set();

      for (const f of candidates) {
        if (used.has(f.id)) continue;

        let bestIdx = -1;
        let bestSim = simTh;

        for (let i = 0; i < people.length; i++) {
          if (f.excludedIds.has(people[i].id)) continue;
          const simC = cosineSimilarity(f.embedding, people[i].centroid);
          const simA = cosineSimilarity(f.embedding, people[i].anchor);
          // Lấy giá trị nhỏ hơn giữa centroid và anchor, đồng thời yêu cầu simC >= simTh
          const sim = Math.min(simC, simA);
          if (simC >= simTh && sim > bestSim) {
            bestSim = sim;
            bestIdx = i;
          }
        }

        if (bestIdx >= 0) {
          used.add(f.id);
          people[bestIdx].faces.push(f);
          people[bestIdx].embs.push(f.embedding);
          people[bestIdx].centroid = calcNormalizedCentroid(people[bestIdx].embs);
        } else {
          used.add(f.id);
          people.push({
            id: `p_${people.length + 1}_${Math.random().toString(36).slice(2, 6)}`,
            name: `N${people.length + 1}`,
            anchor: f.embedding,
            centroid: f.embedding,
            embs: [f.embedding],
            faces: [f]
          });
        }
      }

      people.sort((a, b) => b.faces.length - a.faces.length);
      people.forEach((p, i) => {
        if (/^N\d+$/.test(p.name)) p.name = `N${i + 1}`;
      });

      renderUI();
    }

    // Phương pháp loại trừ: xoá mặt sai, tự động tìm người giống nhất còn lại, >= 3 lần đưa vào Unsure
    window.excludeAndReassign = function(personIdx, faceId) {
      const p = people[personIdx];
      if (!p) return;
      const idx = p.faces.findIndex(x => x.id === faceId);
      if (idx < 0) return;

      const [face] = p.faces.splice(idx, 1);
      face.strikes = (face.strikes || 0) + 1;
      face.excludedIds.add(p.id);

      p.embs = p.faces.map(x => x.embedding);
      if (p.faces.length === 0) {
        people.splice(personIdx, 1);
      } else {
        p.centroid = calcNormalizedCentroid(p.embs);
      }

      if (face.strikes >= 3) {
        face.reason = "Bị xoá khỏi nhóm ≥ 3 lần";
        unsureFaces.push(face);
        setStatus(`Mặt bị xoá ${face.strikes} lần -> chuyển vào Unsure.`);
        renderUI();
        return;
      }

      const baseSim = parseFloat(simThresholdEl.value);
      let nextIdx = -1;
      let maxSim = Math.max(0.35, baseSim - 0.08);

      for (let i = 0; i < people.length; i++) {
        if (face.excludedIds.has(people[i].id)) continue;
        const s = cosineSimilarity(face.embedding, people[i].centroid);
        if (s > maxSim) {
          maxSim = s;
          nextIdx = i;
        }
      }

      if (nextIdx >= 0) {
        people[nextIdx].faces.push(face);
        people[nextIdx].embs.push(face.embedding);
        people[nextIdx].centroid = calcNormalizedCentroid(people[nextIdx].embs);
        setStatus(`Đã loại trừ khỏi "${p.name}" và tự chuyển sang "${people[nextIdx].name}".`);
      } else {
        face.reason = "Không khớp người khác sau loại trừ";
        unsureFaces.push(face);
        setStatus(`Đã loại trừ khỏi "${p.name}", không thấy người khớp -> đưa vào Unsure.`);
      }

      renderUI();
    };

    function mergePerson(fromIdx, toIdx) {
      if (fromIdx === toIdx || !people[fromIdx] || !people[toIdx]) return;
      const src = people[fromIdx];
      const dst = people[toIdx];
      const seen = new Set(dst.faces.map(f => f.id));

      for (const f of src.faces) {
        if (!seen.has(f.id)) {
          seen.add(f.id);
          dst.faces.push(f);
          dst.embs.push(f.embedding);
        }
      }
      dst.centroid = calcNormalizedCentroid(dst.embs);
      people.splice(fromIdx, 1);
      setStatus(`Đã gộp ${src.name} vào ${dst.name}.`);
      renderUI();
    }

    // Kiểm tra lại nhóm Unsure bằng mô hình/cấu hình đối chiếu khác (lật ngang flip + trích xuất lại embedding & nới ngưỡng)
    recheckUnsureBtn.addEventListener("click", async () => {
      if (!unsureFaces.length) {
        setStatus("Không có mặt nào trong Unsure.");
        return;
      }
      recheckUnsureBtn.disabled = true;
      setStatus("Đang đối chiếu lại Unsure (extract lại + horizontal flip augmentation)...");

      const stillUnsure = [];
      const relaxedSim = Math.max(0.38, parseFloat(simThresholdEl.value) - 0.10);

      for (const f of unsureFaces) {
        if (f.strikes >= 3) {
          stillUnsure.push(f);
          continue;
        }

        try {
          const im = await new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = rej;
            i.src = f.url;
          });

          // Thử nhận diện lại trực tiếp trên ảnh crop 240x240 + bản lật ngang (giúp mặt nghiêng khớp tốt hơn)
          const res1 = await human.detect(im);
          let emb1 = res1.face?.[0]?.embedding ? l2Normalize(res1.face[0].embedding) : f.embedding;

          const flipC = document.createElement("canvas");
          flipC.width = 240;
          flipC.height = 240;
          const fCtx = flipC.getContext("2d");
          fCtx.translate(240, 0);
          fCtx.scale(-1, 1);
          fCtx.drawImage(im, 0, 0, 240, 240);
          const res2 = await human.detect(flipC);
          const emb2 = res2.face?.[0]?.embedding ? l2Normalize(res2.face[0].embedding) : null;
          flipC.width = 0;
          flipC.height = 0;

          if (emb1) f.embedding = emb1;

          if ((!emb1 && !emb2) || !people.length) {
            stillUnsure.push(f);
            continue;
          }

          let bestIdx = -1;
          let bestS = relaxedSim;
          for (let i = 0; i < people.length; i++) {
            if (f.excludedIds && f.excludedIds.has(people[i].id)) continue;
            const s1 = emb1 ? cosineSimilarity(emb1, people[i].centroid) : 0;
            const s2 = emb2 ? cosineSimilarity(emb2, people[i].centroid) : 0;
            const s = Math.max(s1, s2);
            if (s > bestS) {
              bestS = s;
              bestIdx = i;
            }
          }

          if (bestIdx >= 0 && f.embedding) {
            people[bestIdx].faces.push(f);
            people[bestIdx].embs.push(f.embedding);
            people[bestIdx].centroid = calcNormalizedCentroid(people[bestIdx].embs);
          } else {
            stillUnsure.push(f);
          }
        } catch (_) {
          stillUnsure.push(f);
        }
      }

      unsureFaces = stillUnsure;
      recheckUnsureBtn.disabled = false;
      setStatus(`Kiểm tra Unsure hoàn tất. Còn ${unsureFaces.length} mặt.`);
      renderUI();
    });

    function renderUI() {
      peopleGrid.innerHTML = "";

      people.forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "person-card";

        const opts = people
          .map((other, oIdx) => oIdx === idx ? "" : `<option value="${oIdx}">→ ${other.name}</option>`)
          .join("");

        card.innerHTML = `
          <div class="person-head">
            <img class="avatar" src="${p.faces[0]?.url || ""}" />
            <input class="name-compact" value="${p.name}" />
            <span class="cnt-pill">${p.faces.length}</span>
          </div>
          <div class="merge-mini">
            <select class="m-sel">${opts || `<option value="">—</option>`}</select>
            <button class="btn btn-sm btn-ghost m-btn" ${opts ? "" : "disabled"}>Gộp</button>
          </div>
          <div class="faces-subgrid"></div>
        `;

        card.querySelector(".name-compact").addEventListener("change", (e) => {
          p.name = e.target.value.trim() || `N${idx + 1}`;
          renderUI();
        });

        card.querySelector(".m-btn").addEventListener("click", () => {
          const t = parseInt(card.querySelector(".m-sel").value, 10);
          if (!Number.isNaN(t)) mergePerson(idx, t);
        });

        const sub = card.querySelector(".faces-subgrid");
        p.faces.forEach(f => {
          const item = document.createElement("div");
          item.className = "face-item";
          item.innerHTML = `
            <img src="${f.url}" />
            <button class="del-x" title="Xoá & tự chuyển người">×</button>
            ${f.strikes > 0 ? `<span class="strike-tag">${f.strikes}/3</span>` : ""}
          `;
          item.querySelector("img").onclick = () => openModal("person", idx, f.id);
          item.querySelector(".del-x").onclick = (ev) => {
            ev.stopPropagation();
            window.excludeAndReassign(idx, f.id);
          };
          sub.appendChild(item);
        });

        peopleGrid.appendChild(card);
      });

      unsureCountEl.textContent = unsureFaces.length;
      unsureGrid.innerHTML = "";
      unsureFaces.forEach(f => {
        const item = document.createElement("div");
        item.className = "face-item";
        item.innerHTML = `
          <img src="${f.url}" />
          <span class="strike-tag">${f.strikes}/3</span>
        `;
        item.querySelector("img").onclick = () => openModal("unsure", -1, f.id);
        unsureGrid.appendChild(item);
      });
    }

    window.openModal = function(source, personIdx, faceId) {
      const face = source === "person"
        ? people[personIdx]?.faces.find(x => x.id === faceId)
        : unsureFaces.find(x => x.id === faceId);
      if (!face) return;

      modalCtx = { source, personIdx, faceId };
      modalImg.src = face.url;
      let cosInfo = "";
      if (source === "person" && people[personIdx] && face.embedding) {
        const cSim = cosineSimilarity(face.embedding, people[personIdx].centroid).toFixed(3);
        const aSim = cosineSimilarity(face.embedding, people[personIdx].anchor).toFixed(3);
        cosInfo = ` • CosCentroid: ${cSim} / CosAnchor: ${aSim}`;
      }
      modalInfo.textContent = `File: ${face.fileName} • Góc nghiêng: ~${Math.round(face.yaw || 0)}°${cosInfo} • Lượt xoá: ${face.strikes}/3 ${face.reason ? "• " + face.reason : ""}`;

      moveTargetSelect.innerHTML = people
        .map((p, i) => (source === "person" && i === personIdx) ? "" : `<option value="${i}">${p.name} (${p.faces.length})</option>`)
        .join("");

      removeStrikeBtn.style.display = source === "person" ? "inline-block" : "none";
      modal.style.display = "flex";
    };

    window.closeModal = function() {
      modal.style.display = "none";
      modalCtx = null;
    };

    moveTargetBtn.addEventListener("click", () => {
      if (!modalCtx) return;
      const targetIdx = parseInt(moveTargetSelect.value, 10);
      if (Number.isNaN(targetIdx) || !people[targetIdx]) return;

      let face = null;
      if (modalCtx.source === "person") {
        const srcP = people[modalCtx.personIdx];
        const i = srcP.faces.findIndex(x => x.id === modalCtx.faceId);
        if (i >= 0) {
          [face] = srcP.faces.splice(i, 1);
          srcP.embs = srcP.faces.map(x => x.embedding);
          if (srcP.faces.length === 0) people.splice(modalCtx.personIdx, 1);
          else srcP.centroid = calcNormalizedCentroid(srcP.embs);
        }
      } else {
        const i = unsureFaces.findIndex(x => x.id === modalCtx.faceId);
        if (i >= 0) [face] = unsureFaces.splice(i, 1);
      }

      if (face && face.embedding) {
        const safeIdx = Math.min(targetIdx, people.length - 1);
        people[safeIdx].faces.push(face);
        people[safeIdx].embs.push(face.embedding);
        people[safeIdx].centroid = calcNormalizedCentroid(people[safeIdx].embs);
      }
      closeModal();
      renderUI();
    });

    removeStrikeBtn.addEventListener("click", () => {
      if (!modalCtx || modalCtx.source !== "person") return;
      const { personIdx, faceId } = modalCtx;
      closeModal();
      window.excludeAndReassign(personIdx, faceId);
    });
  </script>
</body>
</html>
