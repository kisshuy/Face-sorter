<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Sorter v9 — Reliable Scan & Protected DB</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js"></script>
  <script type="module">
    import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
    window.__MP_VISION__ = { FilesetResolver, FaceLandmarker };
  </script>
  <style>
    :root {
      --bg: #eef1f5;
      --card: #ffffff;
      --text: #18202c;
      --muted: #5c6778;
      --accent: #0f62fe;
      --accent-soft: #e6efff;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --danger: #c62828;
      --warn: #b45309;
      --border: #dfe4ec;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px 10px 84px 10px;
    }
    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    h1 { font-size: 16px; margin: 0; font-weight: 700; }
    .db-pill {
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:disabled { background: #aeb8c7; cursor: not-allowed; }
    .btn-ghost { background: #f2f4f8; color: var(--text); border: 1px solid var(--border); }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
    .btn-sm { padding: 4px 8px; font-size: 11.5px; border-radius: 7px; }

    .originals-roll {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      min-height: 44px;
      padding: 3px 6px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 9px;
    }
    .orig-thumb {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }
    .orig-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .orig-idx {
      position: absolute;
      bottom: 0;
      right: 0;
      font-size: 8.5px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      padding: 0 3px;
      border-top-left-radius: 4px;
    }

    .meta-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--muted);
    }
    .meta-row label { display: flex; align-items: center; gap: 5px; font-weight: 600; color: var(--text); }
    input[type="range"] { width: 96px; }
    .stats-bar {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      background: #f6f9ff;
      border: 1px solid #d9e6ff;
      padding: 5px 9px;
      border-radius: 8px;
    }
    .stats-bar.err { color: var(--danger); background: #fef2f2; border-color: #fecaca; }

    .unsure-strip {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 11px;
      padding: 6px 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 58px;
    }
    .unsure-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--warn);
      background: #fef3c7;
      padding: 3px 6px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .unsure-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      align-items: center;
    }
    .unsure-thumb {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 7px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid #f59e0b;
      background: #eee;
    }
    .unsure-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      display: block;
    }

    .people-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      align-items: start;
    }
    .person-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      min-width: 0;
    }
    .person-head {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid var(--accent);
    }
    .name-compact {
      width: 66px;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 5px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .confirm-btn {
      padding: 3px 6px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid #bbf7d0;
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 700;
      cursor: pointer;
    }
    .cnt-pill {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }
    .merge-mini {
      display: flex;
      gap: 4px;
      margin-bottom: 7px;
    }
    .merge-mini select {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      padding: 3px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fafbfc;
    }
    .faces-subgrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }
    .face-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: #e9edf3;
    }
    .face-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }
    .del-x {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: none;
      background: rgba(20, 24, 30, 0.74);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }
    .strike-tag {
      position: absolute;
      bottom: 2px;
      left: 2px;
      font-size: 9px;
      background: rgba(0,0,0,0.68);
      color: #fff;
      padding: 1px 3px;
      border-radius: 3px;
      pointer-events: none;
    }

    .saved-db-section {
      margin-top: 16px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 13px;
      padding: 10px;
    }
    .saved-db-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ok);
    }
    .saved-card {
      background: #ffffff;
      border: 1.5px solid #4ade80;
      border-radius: 12px;
      padding: 8px;
      min-width: 0;
    }
    .lock-badge {
      font-size: 10px;
      background: var(--ok-soft);
      color: var(--ok);
      padding: 2px 5px;
      border-radius: 5px;
      font-weight: 700;
    }

    .fab-wrap {
      position: fixed;
      right: 14px;
      bottom: 16px;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .fab-menu {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
    }
    .fab-menu.open { display: flex; }
    .fab-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(15, 98, 254, 0.35);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12, 16, 22, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-box {
      background: #fff;
      color: var(--text);
      border-radius: 14px;
      padding: 13px;
      max-width: 430px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .compare-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .compare-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
    }
    .compare-card img {
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .sim-badge {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 8px;
      text-align: center;
    }
    .modal-main-img {
      width: 100%;
      max-height: 56vh;
      object-fit: contain;
      border-radius: 9px;
      background: #111;
    }
    .modal-info { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .modal-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title-row">
      <h1>Face Sorter v9 — iPad M1+</h1>
      <div class="db-pill">
        <span>DB đã lưu: <b id="dbCount">0</b> người</span>
        <button id="exportDbBtn" class="btn btn-sm btn-ghost" style="padding:2px 6px;font-size:10.5px;">Export</button>
        <button id="clearDbBtn" class="btn btn-sm btn-ghost" style="padding:2px 6px;font-size:10.5px;">Xoá DB</button>
      </div>
    </div>

    <div class="upload-row">
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <input type="file" id="extraFileInput" accept="image/*" multiple hidden />
      <button id="uploadBtn" class="btn" disabled>Đang tải AI...</button>
      <div id="originalsRoll" class="originals-roll" title="Danh sách ảnh gốc đã upload (bấm để xem)">
        <span style="font-size:11px;color:var(--muted);">Chưa có ảnh gốc</span>
      </div>
    </div>

    <div class="meta-row">
      <label>Khớp tối thiểu: <span id="simLabel">70%</span>
        <input type="range" id="simThreshold" min="52" max="92" step="1" value="70" />
      </label>
      <label>Góc nghiêng tối đa: <span id="yawLabel">45°</span>
        <input type="range" id="maxYaw" min="20" max="60" step="1" value="45" />
      </label>
    </div>
    <div id="status" class="stats-bar">Đang tải mô hình nhận diện khuôn mặt...</div>
  </div>

  <div class="unsure-strip">
    <span class="unsure-badge" id="unsureBadge">0</span>
    <div id="unsureGrid" class="unsure-scroll"></div>
    <button id="recheckUnsureBtn" class="btn btn-sm btn-ghost">Re-check unsure</button>
  </div>

  <div id="peopleGrid" class="people-grid"></div>

  <div class="saved-db-section">
    <div class="saved-db-header">
      <span>Đã lưu vào Database (<span id="savedPeopleCount">0</span> người — Khóa bảo vệ khỏi quét/crop lại)</span>
    </div>
    <div id="savedPeopleGrid" class="people-grid"></div>
  </div>

  <div class="fab-wrap">
    <div id="fabMenu" class="fab-menu">
      <button id="addManualPersonBtn" class="btn btn-sm btn-ghost">+ Thêm người mới thủ công</button>
      <button id="extraUploadBtn" class="btn btn-sm">+ Extra upload thêm ảnh</button>
    </div>
    <button id="fabToggleBtn" class="fab-btn" title="Thêm người hoặc Extra upload">+</button>
  </div>

  <div id="confirmMoveModal" class="overlay" onclick="closeConfirmModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div id="cmpTitle" style="font-size:13.5px;font-weight:700;">Đề xuất chuyển người</div>
      <div class="compare-row">
        <div class="compare-card">
          <img id="cmpSrcImg" src="" alt="" />
          <span id="cmpSrcLabel">Mặt đối chiếu</span>
        </div>
        <div class="sim-badge" id="cmpSimPct">0%</div>
        <div class="compare-card">
          <img id="cmpDstImg" src="" alt="" />
          <span id="cmpDstLabel">Người đích</span>
        </div>
      </div>
      <div id="cmpDesc" class="modal-info"></div>
      <div class="modal-actions">
        <button id="cmpNoBtn" class="btn btn-sm btn-danger">No</button>
        <button id="cmpYesBtn" class="btn btn-sm btn-ok">Yes</button>
      </div>
    </div>
  </div>

  <div id="detailModal" class="overlay" onclick="closeDetailModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img id="detailImg" class="modal-main-img" src="" alt="" />
      <div id="detailInfo" class="modal-info"></div>
      <div id="detailActions" class="modal-actions">
        <select id="moveTargetSelect"></select>
        <button id="moveTargetBtn" class="btn btn-sm">Chuyển người</button>
        <button id="removeStrikeBtn" class="btn btn-sm btn-danger">Xoá (đề xuất chuyển)</button>
        <button class="btn btn-sm btn-ghost" onclick="closeDetailModal()">Đóng</button>
      </div>
    </div>
  </div>

  <script type="module">
    const MP_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    const MP_WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
    const DB_NAME = "FaceSorterProtectedDB_v9";
    const STORE_NAME = "saved_people";

    const fileInput = document.getElementById("fileInput");
    const extraFileInput = document.getElementById("extraFileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const originalsRoll = document.getElementById("originalsRoll");
    const statusEl = document.getElementById("status");
    const simThresholdEl = document.getElementById("simThreshold");
    const simLabel = document.getElementById("simLabel");
    const maxYawEl = document.getElementById("maxYaw");
    const yawLabel = document.getElementById("yawLabel");
    const peopleGrid = document.getElementById("peopleGrid");
    const savedPeopleGrid = document.getElementById("savedPeopleGrid");
    const savedPeopleCountEl = document.getElementById("savedPeopleCount");
    const unsureGrid = document.getElementById("unsureGrid");
    const unsureBadge = document.getElementById("unsureBadge");
    const recheckUnsureBtn = document.getElementById("recheckUnsureBtn");
    const dbCountEl = document.getElementById("dbCount");
    const clearDbBtn = document.getElementById("clearDbBtn");
    const exportDbBtn = document.getElementById("exportDbBtn");

    const fabToggleBtn = document.getElementById("fabToggleBtn");
    const fabMenu = document.getElementById("fabMenu");
    const addManualPersonBtn = document.getElementById("addManualPersonBtn");
    const extraUploadBtn = document.getElementById("extraUploadBtn");

    const confirmMoveModal = document.getElementById("confirmMoveModal");
    const cmpTitle = document.getElementById("cmpTitle");
    const cmpSrcImg = document.getElementById("cmpSrcImg");
    const cmpSrcLabel = document.getElementById("cmpSrcLabel");
    const cmpDstImg = document.getElementById("cmpDstImg");
    const cmpDstLabel = document.getElementById("cmpDstLabel");
    const cmpSimPct = document.getElementById("cmpSimPct");
    const cmpDesc = document.getElementById("cmpDesc");
    const cmpYesBtn = document.getElementById("cmpYesBtn");
    const cmpNoBtn = document.getElementById("cmpNoBtn");

    const detailModal = document.getElementById("detailModal");
    const detailImg = document.getElementById("detailImg");
    const detailInfo = document.getElementById("detailInfo");
    const detailActions = document.getElementById("detailActions");
    const moveTargetSelect = document.getElementById("moveTargetSelect");
    const moveTargetBtn = document.getElementById("moveTargetBtn");
    const removeStrikeBtn = document.getElementById("removeStrikeBtn");

    let human = null;
    let faceLandmarker = null;
    let mpReady = false;
    let uploadedFilesLog = [];
    let processedFileKeys = new Set();
    let allFaces = [];
    let people = [];
    let unsureFaces = [];
    let savedDBPeople = [];
    let dbMatchProposals = [];
    let scanStats = { scanned: 0, skipped: 0 };
    let pendingModalAction = null;
    let detailCtx = null;
    let idSeq = 0;

    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.className = isErr ? "stats-bar err" : "stats-bar";
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function loadSavedDB() {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, "readonly");
        const rows = await new Promise((res, rej) => {
          const r = tx.objectStore(STORE_NAME).getAll();
          r.onsuccess = () => res(r.result || []);
          r.onerror = () => rej(r.error);
        });
        savedDBPeople = rows.map(r => ({
          id: r.id,
          name: r.name,
          centroid: l2Normalize(Float32Array.from(r.centroid)),
          embs: (r.embs || []).map(e => l2Normalize(Float32Array.from(e))),
          faces: (r.faces || []).map(f => ({
            id: f.id,
            url: f.url,
            fileName: f.fileName || r.name
          }))
        }));
        dbCountEl.textContent = savedDBPeople.length;
        savedPeopleCountEl.textContent = savedDBPeople.length;
        renderSavedDBSection();
      } catch (err) {
        console.warn("DB load error:", err);
      }
    }

    async function persistSavedPerson(personObj) {
      const validEmbs = (personObj.embs || []).slice(0, 24).map(e => Array.from(e));
      if (!validEmbs.length) return;
      const centroidArr = Array.from(calcNormalizedCentroid(validEmbs.map(e => Float32Array.from(e))));
      const savedFaces = (personObj.faces || []).slice(0, 30).map(f => ({
        id: f.id,
        url: f.url,
        fileName: f.fileName || ""
      }));

      const db = await openDB();
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put({
        id: personObj.id,
        name: personObj.name.trim(),
        centroid: centroidArr,
        embs: validEmbs,
        faces: savedFaces,
        updatedAt: Date.now()
      });
      await new Promise(res => { tx.oncomplete = res; });
      await loadSavedDB();
    }

    clearDbBtn.addEventListener("click", async () => {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).clear();
      await new Promise(res => { tx.oncomplete = res; });
      savedDBPeople = [];
      dbCountEl.textContent = "0";
      savedPeopleCountEl.textContent = "0";
      renderSavedDBSection();
      setStatus("Đã xoá toàn bộ dữ liệu người đã lưu trong DB.");
    });

    exportDbBtn.addEventListener("click", () => {
      const dataStr = JSON.stringify(savedDBPeople.map(p => ({
        id: p.id,
        name: p.name,
        centroid: Array.from(p.centroid),
        embs: p.embs.map(e => Array.from(e)),
        faces: p.faces
      })));
      const blob = new Blob([dataStr], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `face-sorter-db-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    });

    async function initModels() {
      await loadSavedDB();
      try {
        let wait = 0;
        while (!window.Human && wait < 120) {
          await new Promise(r => setTimeout(r, 100));
          wait++;
        }
        if (!window.Human) {
          throw new Error("Không tải được thư viện Human.");
        }

        // Cấu hình ngưỡng dò nới lỏng hơn để không bỏ sót mặt nghiêng, mặt nhỏ, mặt xa hoặc ảnh mờ
        human = new window.Human.Human({
          backend: "webgl",
          modelBasePath: "https://cdn.jsdelivr.net/npm/@vladmandic/human/models/",
          cacheSensitivity: 0,
          face: {
            enabled: true,
            detector: { enabled: true, maxDetected: 24, minConfidence: 0.35, rotation: true },
            mesh: { enabled: true },
            iris: { enabled: false },
            description: { enabled: true },
            emotion: { enabled: false },
            antispoof: { enabled: false },
            liveness: { enabled: false }
          },
          body: { enabled: false },
          hand: { enabled: false },
          object: { enabled: false },
          gesture: { enabled: false }
        });
        await human.load();

    function l2Normalize(vec) {
      let norm = 0;
      for (let i = 0; i < vec.length; i++) norm += vec[i] * vec[i];
      norm = Math.sqrt(norm) || 1;
      const out = new Float32Array(vec.length);
      for (let i = 0; i < vec.length; i++) out[i] = vec[i] / norm;
      return out;
    }

    function cosineSimilarity(a, b) {
      if (!a || !b || a.length !== b.length) return -1;
      let dot = 0;
      for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
      return Math.max(-1, Math.min(1, dot));
    }

    function similarityToPerson(emb, person) {
      if (!emb || !person || !person.centroid) return 0;
      const simCentroid = cosineSimilarity(emb, person.centroid);
      let maxSampleSim = simCentroid;
      for (const s of (person.embs || [])) {
        const sim = cosineSimilarity(emb, s);
        if (sim > maxSampleSim) maxSampleSim = sim;
      }
      return 0.65 * maxSampleSim + 0.35 * simCentroid;
    }

    function calcNormalizedCentroid(vectors) {
      const len = vectors[0].length;
      const sum = new Float32Array(len);
      for (const v of vectors) {
        for (let i = 0; i < len; i++) sum[i] += v[i];
      }
      let norm = 0;
      for (let i = 0; i < len; i++) {
        sum[i] /= vectors.length;
        norm += sum[i] * sum[i];
      }
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < len; i++) sum[i] /= norm;
      return sum;
    }

    function estimateYawDegFromMatrix(matrixData) {
      if (!matrixData || matrixData.length < 16) return 0;
      return Math.abs((Math.atan2(matrixData[8], matrixData[10]) * 180) / Math.PI);
    }

    function fileToCanvas(file, maxDim = 1600) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const c = document.createElement("canvas");
          c.width = width;
          c.height = height;
          c.getContext("2d").drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);
          resolve(c);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Lỗi đọc ảnh"));
        };
        img.src = url;
      });
    }

    function makeThumbUrl(canvas, size = 96) {
      const t = document.createElement("canvas");
      t.width = size;
      t.height = size;
      t.getContext("2d").drawImage(canvas, 0, 0, size, size);
      const u = t.toDataURL("image/jpeg", 0.78);
      t.width = 0; t.height = 0;
      return u;
    }

    // Crop khuôn mặt tin cậy nhưng KHÔNG loại bỏ nhầm mặt thật:
    // - Chỉ loại bỏ các dải cực hẹp/dài bất thường do tóc bắt nhầm (aspect < 0.42 hoặc > 2.4).
    // - Nếu MediaPipe khớp tâm thì dùng vùng giao hợp lý + nới nhẹ để đủ đầu/cằm; nếu MediaPipe không kịp dò mặt nghiêng/nhỏ thì vẫn crop từ khung Human (không bỏ sót mặt!).
    function cropFaceSmart(sourceCanvas, box, allBoxes, mpFaces, outSize = 240) {
      const aspectRaw = box.width / Math.max(1, box.height);
      if (aspectRaw < 0.40 || aspectRaw > 2.5) {
        return null;
      }

      const cx = box.x + box.width / 2;
      const cy = box.y + box.height / 2;

      let matchedMp = null;
      let bestD = Infinity;
      for (const m of mpFaces) {
        const d = Math.hypot(m.cx - cx, m.cy - cy);
        if (d < bestD && d < Math.max(box.width, box.height) * 0.8) {
          bestD = d;
          matchedMp = m;
        }
      }

      let x1, y1, x2, y2, yaw = 0;
      if (matchedMp) {
        yaw = matchedMp.yaw;
        const padX = Math.max(box.width, matchedMp.box.width) * 0.14;
        const padYTop = Math.max(box.height, matchedMp.box.height) * 0.22;
        const padYBot = Math.max(box.height, matchedMp.box.height) * 0.16;
        x1 = Math.max(0, Math.min(box.x, matchedMp.box.x) - padX * 0.5);
        y1 = Math.max(0, Math.min(box.y, matchedMp.box.y) - padYTop * 0.6);
        x2 = Math.min(sourceCanvas.width, Math.max(box.x + box.width, matchedMp.box.x + matchedMp.box.width) + padX * 0.5);
        y2 = Math.min(sourceCanvas.height, Math.max(box.y + box.height, matchedMp.box.y + matchedMp.box.height) + padYBot * 0.6);
      } else {
        // Fallback giữ trọn khuôn mặt Human nếu MediaPipe không dò ra
        const padX = box.width * 0.14;
        const padY = box.height * 0.18;
        x1 = Math.max(0, box.x - padX);
        y1 = Math.max(0, box.y - padY);
        x2 = Math.min(sourceCanvas.width, box.x + box.width + padX);
        y2 = Math.min(sourceCanvas.height, box.y + box.height + padY);
      }

      // Kẹp biên không chạm khung mặt khác
      for (const other of allBoxes) {
        if (other === box) continue;
        const ox1 = other.x, oy1 = other.y;
        const ox2 = other.x + other.width, oy2 = other.y + other.height;
        const overlapY = Math.min(y2, oy2) - Math.max(y1, oy1);
        const overlapX = Math.min(x2, ox2) - Math.max(x1, ox1);

        if (overlapY > 0) {
          if (ox1 > x1 && ox1 < x2) x2 = Math.max(x1 + 20, ox1 - 2);
          if (ox2 < x2 && ox2 > x1) x1 = Math.min(x2 - 20, ox2 + 2);
        }
        if (overlapX > 0) {
          if (oy1 > y1 && oy1 < y2) y2 = Math.max(y1 + 20, oy1 - 2);
          if (oy2 < y2 && oy2 > y1) y1 = Math.min(y2 - 20, oy2 + 2);
        }
      }

      const w = Math.round(x2 - x1);
      const h = Math.round(y2 - y1);
      if (w < 20 || h < 20) return null;

      const out = document.createElement("canvas");
      out.width = outSize;
      out.height = outSize;
      out.getContext("2d").drawImage(sourceCanvas, Math.round(x1), Math.round(y1), w, h, 0, 0, outSize, outSize);
      const dataUrl = out.toDataURL("image/jpeg", 0.92);
      out.width = 0; out.height = 0;
      return { url: dataUrl, yaw };
    }

    function renderOriginalsRoll() {
      if (!uploadedFilesLog.length) {

    async function processIncrementalFiles(files, isExtra) {
      uploadBtn.disabled = true;
      extraUploadBtn.disabled = true;

      const newFiles = files.filter(f => {
        const key = `${f.name}_${f.size}_${f.lastModified}`;
        return !processedFileKeys.has(key);
      });

      if (!newFiles.length) {
        setStatus("Tất cả file chọn đều đã được upload & crop trước đó, không quét lại.");
        uploadBtn.disabled = false;
        extraUploadBtn.disabled = false;
        return;
      }

      const newlyExtractedFaces = [];

      for (let i = 0; i < newFiles.length; i++) {
        const file = newFiles[i];
        const fileKey = `${file.name}_${file.size}_${file.lastModified}`;
        setStatus(`Đang quét ${isExtra ? "extra " : ""}ảnh mới ${i + 1}/${newFiles.length}...`);
        await new Promise(r => setTimeout(r, 10));

        try {
          const canvas = await fileToCanvas(file, 1600);
          const baseName = file.name.replace(/\.[^.]+$/, "");

          uploadedFilesLog.push({
            key: fileKey,
            name: file.name,
            thumbUrl: makeThumbUrl(canvas, 84),
            fullUrl: canvas.toDataURL("image/jpeg", 0.85)
          });
          processedFileKeys.add(fileKey);
          renderOriginalsRoll();

          const mpFaces = [];
          if (mpReady && faceLandmarker) {
            try {
              const mpRes = faceLandmarker.detect(canvas);
              if (mpRes && mpRes.faceLandmarks) {
                mpRes.faceLandmarks.forEach((lms, k) => {
                  let minX = 1, minY = 1, maxX = 0, maxY = 0;
                  for (const pt of lms) {
                    if (pt.x < minX) minX = pt.x;
                    if (pt.y < minY) minY = pt.y;
                    if (pt.x > maxX) maxX = pt.x;
                    if (pt.y > maxY) maxY = pt.y;
                  }
                  const yaw = mpRes.facialTransformationMatrixes?.[k]
                    ? estimateYawDegFromMatrix(mpRes.facialTransformationMatrixes[k].data)
                    : 0;
                  mpFaces.push({
                    cx: ((minX + maxX) / 2) * canvas.width,
                    cy: ((minY + maxY) / 2) * canvas.height,
                    box: {
                      x: minX * canvas.width,
                      y: minY * canvas.height,
                      width: (maxX - minX) * canvas.width,
                      height: (maxY - minY) * canvas.height
                    },
                    yaw
                  });
                });
              }
            } catch (_) {}
          }

          const hRes = await human.detect(canvas);
          const rawHuman = hRes.face || [];
          const allBoxes = rawHuman.filter(f => f.box).map(f => ({
            x: f.box[0], y: f.box[1], width: f.box[2], height: f.box[3]
          }));

          rawHuman.forEach((f, idx) => {
            if (!f.box || f.box[2] < 24 || f.box[3] < 24 || !f.embedding || !f.embedding.length) {
              scanStats.skipped++;
              return;
            }
            const box = { x: f.box[0], y: f.box[1], width: f.box[2], height: f.box[3] };
            const cropped = cropFaceSmart(canvas, box, allBoxes, mpFaces, 240);
            if (!cropped) {
              scanStats.skipped++;
              return;
            }

            idSeq++;
            scanStats.scanned++;
            const faceObj = {
              id: `f_${idSeq}`,
              url: cropped.url,
              fileName: `${baseName}_m${idx + 1}.jpg`,
              embedding: l2Normalize(f.embedding),
              score: f.faceScore || f.boxScore || 0.5,
              yaw: cropped.yaw,
              strikes: 0,
              excludedIds: new Set(),
              reason: ""
            };
            allFaces.push(faceObj);
            newlyExtractedFaces.push(faceObj);
          });

          canvas.width = 0; canvas.height = 0;
        } catch (err) {
          console.warn(err);
        }
      }

      if (isExtra) {
        assignIncrementalFaces(newlyExtractedFaces);
      } else {
        clusterWorkingFacesOnly();
      }

      uploadBtn.disabled = false;
      extraUploadBtn.disabled = false;
      updateSummaryStatus();
      queueDatabaseMatchProposals(newlyExtractedFaces);
    }

    function assignIncrementalFaces(newFaces) {
      const simTh = parseFloat(simThresholdEl.value) / 100;
      const maxYaw = parseFloat(maxYawEl.value);
      const maxPeopleLimit = Math.max(1, Math.floor((allFaces.length * 2) / 3));

      for (const f of newFaces) {
        if (f.yaw > maxYaw) {
          f.reason = `Nghiêng ~${Math.round(f.yaw)}° > ${maxYaw}°`;
          unsureFaces.push(f);
          continue;
        }

        let bestIdx = -1;
        let bestSim = simTh;
        for (let i = 0; i < people.length; i++) {
          if (!people[i].centroid) continue;
          const s = similarityToPerson(f.embedding, people[i]);
          if (s >= simTh && s > bestSim) {
            bestSim = s;
            bestIdx = i;
          }
        }

        if (bestIdx >= 0) {
          people[bestIdx].faces.push(f);
          people[bestIdx].embs.push(f.embedding);
          people[bestIdx].centroid = calcNormalizedCentroid(people[bestIdx].embs);
        } else if (people.length < maxPeopleLimit) {
          people.push({
            id: `p_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
            name: `N${people.length + 1}`,
            centroid: f.embedding,
            embs: [f.embedding],
            faces: [f]
          });
        } else {
          f.reason = "Chạm trần số nhóm (≤ 2/3 số mặt)";
          unsureFaces.push(f);
        }
      }

      renderWorkingUI();
    }

    function clusterWorkingFacesOnly() {
      const simTh = parseFloat(simThresholdEl.value) / 100;
      const maxYaw = parseFloat(maxYawEl.value);

      const permanentUnsure = unsureFaces.filter(f => f.strikes >= 3);
      unsureFaces = [...permanentUnsure];
      const manualEmptyGroups = people.filter(p => p.faces.length === 0);
      people = [...manualEmptyGroups];

      const candidates = [];
      for (const f of allFaces) {
        if (f.strikes >= 3 || f.mergedToSavedDB) continue;
        if (f.yaw > maxYaw) {
          unsureFaces.push({ ...f, reason: `Nghiêng ~${Math.round(f.yaw)}° > ${maxYaw}°` });
          continue;
        }
        candidates.push(f);
      }

      candidates.sort((a, b) => b.score - a.score);
      const maxPeopleLimit = Math.max(1, Math.floor((allFaces.length * 2) / 3));

      for (const f of candidates) {
        let bestIdx = -1;
        let bestSim = simTh;

        for (let i = 0; i < people.length; i++) {
          if (f.excludedIds.has(people[i].id) || !people[i].centroid) continue;
          const sim = similarityToPerson(f.embedding, people[i]);
          if (sim >= simTh && sim > bestSim) {
            bestSim = sim;
            bestIdx = i;
          }
        }

        if (bestIdx >= 0) {
          people[bestIdx].faces.push(f);
          people[bestIdx].embs.push(f.embedding);
          people[bestIdx].centroid = calcNormalizedCentroid(people[bestIdx].embs);
        } else if (people.length < maxPeopleLimit) {
          people.push({
            id: `p_${people.length + 1}_${Math.random().toString(36).slice(2, 6)}`,
            name: `N${people.length + 1}`,
            centroid: f.embedding,
            embs: [f.embedding],
            faces: [f]
          });
        } else {
          f.reason = `Chạm trần ${maxPeopleLimit} người (≤ 2/3 số mặt)`;
          unsureFaces.push(f);
        }
      }

      people.sort((a, b) => b.faces.length - a.faces.length);
      let idxLabel = 1;
      people.forEach(p => {
        if (/^N\d+$/.test(p.name)) p.name = `N${idxLabel++}`;
      });

      renderWorkingUI();
      updateSummaryStatus();
    }

    function queueDatabaseMatchProposals(targetFaces) {
      if (!savedDBPeople.length || !targetFaces.length) return;
      const dbMatchTh = Math.max(0.68, (parseFloat(simThresholdEl.value) / 100) - 0.03);
      dbMatchProposals = [];

      for (const p of people) {
        if (!p.centroid || !p.faces.length) continue;
        let bestDb = null;
        let bestSim = dbMatchTh;
        for (const dbP of savedDBPeople) {
          const s = similarityToPerson(p.centroid, dbP);
          if (s >= dbMatchTh && s > bestSim) {
            bestSim = s;
            bestDb = dbP;
          }
        }
        if (bestDb) {
          dbMatchProposals.push({
            type: "group_to_db",
            workingPersonId: p.id,
            dbPersonId: bestDb.id,
            sim: bestSim
          });
        }
      }

      if (dbMatchProposals.length > 0) {
        showNextDbProposal();
      }
    }

    function showNextDbProposal() {
      if (!dbMatchProposals.length) return;
      const prop = dbMatchProposals.shift();
      const wP = people.find(p => p.id === prop.workingPersonId);
      const dbP = savedDBPeople.find(p => p.id === prop.dbPersonId);
      if (!wP || !dbP || !wP.faces.length) {
        showNextDbProposal();
        return;
      }

      const pct = Math.round(prop.sim * 100);
      pendingModalAction = {
        mode: "merge_to_db",
        workingPersonId: wP.id,
        dbPersonId: dbP.id
      };

      cmpTitle.textContent = "Phát hiện trùng với người đã lưu trong Database";
      cmpSrcImg.src = wP.faces[0]?.url || "";
      cmpSrcLabel.textContent = `Nhóm mới: ${wP.name} (${wP.faces.length} mặt)`;
      cmpDstImg.src = dbP.faces[0]?.url || "";
      cmpDstLabel.textContent = `DB: ${dbP.name} (${dbP.faces.length} mặt)`;
      cmpSimPct.textContent = `${pct}%`;
      cmpDesc.textContent = `Nhóm "${wP.name}" giống ${pct}% với "${dbP.name}" đã lưu trong Database. Bạn có muốn gom các mặt này vào "${dbP.name}" không?`;
      confirmMoveModal.style.display = "flex";
    }

    function updateSummaryStatus() {
      const maxAllowed = Math.max(1, Math.floor((allFaces.length * 2) / 3));
      setStatus(
        `Đã scan: ${scanStats.scanned} mặt • Bỏ qua: ${scanStats.skipped} mặt • Nhóm mới: ${people.length}/${maxAllowed} • Unsure: ${unsureFaces.length} • DB khóa: ${savedDBPeople.length}`
      );
    }

    async function confirmSavePersonToBottomDB(personIdx) {
      const p = people[personIdx];
      if (!p || !p.faces.length) return;

      const cleanName = p.name.trim();
      let existingDb = savedDBPeople.find(d => d.name.toLowerCase() === cleanName.toLowerCase());

      if (existingDb) {
        for (const f of p.faces) {
          f.mergedToSavedDB = true;
          existingDb.faces.push({ id: f.id, url: f.url, fileName: f.fileName });
          if (f.embedding) existingDb.embs.push(f.embedding);
        }
        existingDb.centroid = calcNormalizedCentroid(existingDb.embs);
        await persistSavedPerson(existingDb);
      } else {
        const newDbPerson = {
          id: `db_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
          name: cleanName,
          embs: p.faces.filter(f => f.embedding).map(f => f.embedding),
          faces: p.faces.map(f => ({ id: f.id, url: f.url, fileName: f.fileName }))
        };
        p.faces.forEach(f => { f.mergedToSavedDB = true; });
        await persistSavedPerson(newDbPerson);
      }

      people.splice(personIdx, 1);
      renderWorkingUI();
      updateSummaryStatus();
      setStatus(`Đã lưu & khóa "${cleanName}" vào khung Database cuối trang.`);
    }

    window.proposeReassignOnDelete = function(personIdx, faceId) {
      const srcPerson = people[personIdx];
      if (!srcPerson) return;
      const fIdx = srcPerson.faces.findIndex(x => x.id === faceId);
      if (fIdx < 0) return;

      const face = srcPerson.faces[fIdx];
      const nextStrikes = (face.strikes || 0) + 1;

      if (nextStrikes >= 3) {
        srcPerson.faces.splice(fIdx, 1);
        face.strikes = 3;
        face.excludedIds.add(srcPerson.id);
        face.reason = "Đã bị xoá 3 lần";
        recalcWorkingGroup(personIdx);
        unsureFaces.push(face);
        renderWorkingUI();
        updateSummaryStatus();
        return;
      }

      let bestCandidate = null;
      let bestSim = -1;

      for (let i = 0; i < people.length; i++) {
        if (i === personIdx) continue;
        if (face.excludedIds.has(people[i].id) || !people[i].centroid) continue;
        const s = similarityToPerson(face.embedding, people[i]);
        if (s > bestSim) {
          bestSim = s;
          bestCandidate = { isDB: false, person: people[i] };
        }
      }
      for (const dbP of savedDBPeople) {
        if (face.excludedIds.has(dbP.id)) continue;
        const s = similarityToPerson(face.embedding, dbP);
        if (s > bestSim) {
          bestSim = s;
          bestCandidate = { isDB: true, person: dbP };
        }
      }

      if (!bestCandidate) {
        srcPerson.faces.splice(fIdx, 1);
        face.strikes = nextStrikes;
        face.excludedIds.add(srcPerson.id);
        face.reason = `Xoá ${face.strikes}/3`;
        recalcWorkingGroup(personIdx);
        unsureFaces.push(face);
        renderWorkingUI();
        updateSummaryStatus();
        return;
      }

      const pct = Math.max(0, Math.round(bestSim * 100));
      pendingModalAction = {
        mode: "delete_reassign",
        srcPersonId: srcPerson.id,
        dstPersonId: bestCandidate.person.id,
        dstIsDB: bestCandidate.isDB,
        faceId: face.id
      };

      cmpTitle.textContent = "Đề xuất chuyển sang người gần giống nhất";
      cmpSrcImg.src = face.url;
      cmpSrcLabel.textContent = `Từ ${srcPerson.name} (lần ${nextStrikes}/3)`;
      cmpDstImg.src = bestCandidate.person.faces[0]?.url || "";
      cmpDstLabel.textContent = `${bestCandidate.isDB ? "[DB] " : ""}${bestCandidate.person.name}`;
      cmpSimPct.textContent = `${pct}%`;
      cmpDesc.textContent = `Mặt này giống "${bestCandidate.person.name}" (${pct}%). Bấm Yes để chuyển sang, hoặc No để loại trừ.`;
      confirmMoveModal.style.display = "flex";
    };

    window.closeConfirmModal = function() {
      confirmMoveModal.style.display = "none";
      pendingModalAction = null;
      if (dbMatchProposals.length > 0) {
        setTimeout(showNextDbProposal, 120);
      }
    };

    cmpYesBtn.addEventListener("click", async () => {
      if (!pendingModalAction) return;
      const act = pendingModalAction;

      if (act.mode === "merge_to_db") {
        const wIdx = people.findIndex(p => p.id === act.workingPersonId);
        const dbP = savedDBPeople.find(p => p.id === act.dbPersonId);
        if (wIdx >= 0 && dbP) {
          const wP = people[wIdx];
          for (const f of wP.faces) {
            f.mergedToSavedDB = true;
            dbP.faces.push({ id: f.id, url: f.url, fileName: f.fileName });
            if (f.embedding) dbP.embs.push(f.embedding);
          }
          dbP.centroid = calcNormalizedCentroid(dbP.embs);
          await persistSavedPerson(dbP);
          people.splice(wIdx, 1);
          renderWorkingUI();
          updateSummaryStatus();
        }
        closeConfirmModal();
        return;
      }

      if (act.mode === "delete_reassign") {
        const srcIdx = people.findIndex(p => p.id === act.srcPersonId);
        if (srcIdx < 0) { closeConfirmModal(); return; }
        const fIdx = people[srcIdx].faces.findIndex(x => x.id === act.faceId);
        if (fIdx < 0) { closeConfirmModal(); return; }

        const [face] = people[srcIdx].faces.splice(fIdx, 1);
        face.strikes = (face.strikes || 0) + 1;
        face.excludedIds.add(people[srcIdx].id);
        recalcWorkingGroup(srcIdx);

        if (act.dstIsDB) {
          const dbP = savedDBPeople.find(p => p.id === act.dstPersonId);
          if (dbP) {
            face.mergedToSavedDB = true;
            dbP.faces.push({ id: face.id, url: face.url, fileName: face.fileName });
            if (face.embedding) dbP.embs.push(face.embedding);
            dbP.centroid = calcNormalizedCentroid(dbP.embs);
            await persistSavedPerson(dbP);
          }
        } else {
          const dstIdx = people.findIndex(p => p.id === act.dstPersonId);
          if (dstIdx >= 0) {
            people[dstIdx].faces.push(face);
            people[dstIdx].embs.push(face.embedding);
            people[dstIdx].centroid = calcNormalizedCentroid(people[dstIdx].embs);
          }
        }

        renderWorkingUI();
        updateSummaryStatus();
        closeConfirmModal();
      }
    });

    cmpNoBtn.addEventListener("click", () => {
      if (!pendingModalAction) return;
      const act = pendingModalAction;

      if (act.mode === "merge_to_db") {
        closeConfirmModal();
        return;
      }

      if (act.mode === "delete_reassign") {
        const srcIdx = people.findIndex(p => p.id === act.srcPersonId);
        if (srcIdx < 0) { closeConfirmModal(); return; }
        const fIdx = people[srcIdx].faces.findIndex(x => x.id === act.faceId);
        if (fIdx < 0) { closeConfirmModal(); return; }

        const [face] = people[srcIdx].faces.splice(fIdx, 1);
        face.strikes = (face.strikes || 0) + 1;
        face.excludedIds.add(people[srcIdx].id);
        face.excludedIds.add(act.dstPersonId);
        recalcWorkingGroup(srcIdx);

        if (face.strikes >= 3) {
          face.reason = "Đã bị xoá 3 lần";
          unsureFaces.push(face);
        } else {
          let nextIdx = -1;
          let nextSim = 0.54;
          for (let i = 0; i < people.length; i++) {
            if (face.excludedIds.has(people[i].id) || !people[i].centroid) continue;
            const s = similarityToPerson(face.embedding, people[i]);
            if (s > nextSim) { nextSim = s; nextIdx = i; }
          }
          if (nextIdx >= 0) {
            people[nextIdx].faces.push(face);
            people[nextIdx].embs.push(face.embedding);
            people[nextIdx].centroid = calcNormalizedCentroid(people[nextIdx].embs);
          } else {
            face.reason = `Xoá ${face.strikes}/3`;
            unsureFaces.push(face);
          }
        }

        renderWorkingUI();
        updateSummaryStatus();
        closeConfirmModal();
      }
    });

    function recalcWorkingGroup(idx) {
      const p = people[idx];
      if (!p) return;
      if (p.faces.length === 0) {
        people.splice(idx, 1);
      } else {
        p.embs = p.faces.map(x => x.embedding);
        p.centroid = calcNormalizedCentroid(p.embs);
      }
    }

    function mergeWorkingPerson(fromIdx, toIdx) {
      if (fromIdx === toIdx || !people[fromIdx] || !people[toIdx]) return;
      const src = people[fromIdx];
      const dst = people[toIdx];
      const seen = new Set(dst.faces.map(f => f.id));
      for (const f of src.faces) {
        if (!seen.has(f.id)) {
          seen.add(f.id);
          dst.faces.push(f);
          dst.embs.push(f.embedding);
        }
      }
      if (dst.embs.length) dst.centroid = calcNormalizedCentroid(dst.embs);
      people.splice(fromIdx, 1);
      renderWorkingUI();
      updateSummaryStatus();
    }

    recheckUnsureBtn.addEventListener("click", async () => {
      if (!unsureFaces.length) return;
      recheckUnsureBtn.disabled = true;

      const stillUnsure = [];
      const relaxedSim = Math.max(0.55, (parseFloat(simThresholdEl.value) / 100) - 0.08);

      for (const f of unsureFaces) {
        if (f.strikes >= 3) {
          stillUnsure.push(f);
          continue;
        }
        try {
          const im = await new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = rej;
            i.src = f.url;
          });

          const flipC = document.createElement("canvas");
          flipC.width = 240; flipC.height = 240;
          const ctx = flipC.getContext("2d");
          ctx.translate(240, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(im, 0, 0, 240, 240);
          const resFlip = await human.detect(flipC);
          const embFlip = resFlip.face?.[0]?.embedding ? l2Normalize(resFlip.face[0].embedding) : null;
          flipC.width = 0; flipC.height = 0;

          let bestIdx = -1;
          let bestS = relaxedSim;
          for (let i = 0; i < people.length; i++) {
            if ((f.excludedIds && f.excludedIds.has(people[i].id)) || !people[i].centroid) continue;
            const s1 = similarityToPerson(f.embedding, people[i]);
            const s2 = embFlip ? similarityToPerson(embFlip, people[i]) : 0;
            const s = Math.max(s1, s2);
            if (s > bestS) { bestS = s; bestIdx = i; }
          }

          if (bestIdx >= 0) {
            people[bestIdx].faces.push(f);
            people[bestIdx].embs.push(f.embedding);
            people[bestIdx].centroid = calcNormalizedCentroid(people[bestIdx].embs);
          } else {
            stillUnsure.push(f);
          }
        } catch (_) {
          stillUnsure.push(f);
        }
      }

      unsureFaces = stillUnsure;
      recheckUnsureBtn.disabled = false;
      renderWorkingUI();
      updateSummaryStatus();
    });

    function renderWorkingUI() {
      unsureBadge.textContent = unsureFaces.length;
      unsureGrid.innerHTML = "";
      unsureFaces.forEach(f => {
        const div = document.createElement("div");
        div.className = "unsure-thumb";
        div.innerHTML = `
          <img src="${f.url}" />
          ${f.strikes > 0 ? `<span class="strike-tag">${f.strikes}/3</span>` : ""}
        `;
        div.querySelector("img").onclick = () => openDetailModal("unsure", -1, f.id);
        unsureGrid.appendChild(div);
      });

      peopleGrid.innerHTML = "";
      people.forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "person-card";

        const opts = people
          .map((other, oIdx) => oIdx === idx ? "" : `<option value="${oIdx}">→ ${other.name}</option>`)
          .join("");

        card.innerHTML = `
          <div class="person-head">
            <img class="avatar" src="${p.faces[0]?.url || ""}" />
            <input class="name-compact" value="${p.name}" />
            <button class="confirm-btn" title="Confirm & Save xuống DB cuối trang">Lưu</button>
            <span class="cnt-pill">${p.faces.length}</span>
          </div>
          <div class="merge-mini">
            <select class="m-sel">${opts || `<option value="">—</option>`}</select>
            <button class="btn btn-sm btn-ghost m-btn" ${opts ? "" : "disabled"}>Gộp</button>
          </div>
          <div class="faces-subgrid"></div>
        `;

        card.querySelector(".name-compact").addEventListener("change", (e) => {
          p.name = e.target.value.trim() || `N${idx + 1}`;
          renderWorkingUI();
        });

        card.querySelector(".confirm-btn").addEventListener("click", () => {
          confirmSavePersonToBottomDB(idx);
        });

        card.querySelector(".m-btn").addEventListener("click", () => {
          const t = parseInt(card.querySelector(".m-sel").value, 10);
          if (!Number.isNaN(t)) mergeWorkingPerson(idx, t);
        });

        const sub = card.querySelector(".faces-subgrid");
        p.faces.forEach(f => {
          const item = document.createElement("div");
          item.className = "face-item";
          item.innerHTML = `
            <img src="${f.url}" />
            <button class="del-x" title="Xoá & đề xuất chuyển">×</button>
            ${f.strikes > 0 ? `<span class="strike-tag">${f.strikes}/3</span>` : ""}
          `;
          item.querySelector("img").onclick = () => openDetailModal("person", idx, f.id);
          item.querySelector(".del-x").onclick = (ev) => {
            ev.stopPropagation();
            window.proposeReassignOnDelete(idx, f.id);
          };
          sub.appendChild(item);
        });

        peopleGrid.appendChild(card);
      });
    }

    function renderSavedDBSection() {
      savedPeopleGrid.innerHTML = "";
      if (!savedDBPeople.length) {
        savedPeopleGrid.innerHTML = `<div style="font-size:11.5px;color:var(--muted);grid-column:1/-1;">Chưa có người nào được Confirm Save. Đặt tên nhóm ở trên và bấm "Lưu" để khóa xuống đây.</div>`;
        return;
      }

      savedDBPeople.forEach(dbP => {
        const card = document.createElement("div");
        card.className = "saved-card";
        card.innerHTML = `
          <div class="person-head">
            <img class="avatar" src="${dbP.faces[0]?.url || ""}" style="border-color:var(--ok);" />
            <strong style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${dbP.name}</strong>
            <span class="lock-badge">DB • ${dbP.faces.length}</span>
          </div>
          <div class="faces-subgrid"></div>
        `;
        const sub = card.querySelector(".faces-subgrid");
        dbP.faces.forEach(f => {
          const item = document.createElement("div");
          item.className = "face-item";
          item.innerHTML = `<img src="${f.url}" />`;
          item.querySelector("img").onclick = () => {
            detailImg.src = f.url;
            detailInfo.textContent = `[DB Đã khóa] ${dbP.name} • ${f.fileName}`;
            detailActions.style.display = "none";
            detailModal.style.display = "flex";
          };
          sub.appendChild(item);
        });
        savedPeopleGrid.appendChild(card);
      });
    }

    window.openDetailModal = function(source, personIdx, faceId) {
      const face = source === "person"
        ? people[personIdx]?.faces.find(x => x.id === faceId)
        : unsureFaces.find(x => x.id === faceId);
      if (!face) return;

      detailCtx = { source, personIdx, faceId };
      detailImg.src = face.url;
      detailActions.style.display = "flex";

      let simText = "";
      if (source === "person" && people[personIdx]?.centroid) {
        const pct = Math.round(similarityToPerson(face.embedding, people[personIdx]) * 100);
        simText = ` • Giống nhóm: ${pct}%`;
      }
      detailInfo.textContent = `${face.fileName} • Nghiêng ~${Math.round(face.yaw || 0)}°${simText} • Xoá: ${face.strikes}/3 ${face.reason ? "• " + face.reason : ""}`;

      const workingOpts = people
        .map((p, i) => (source === "person" && i === personIdx) ? "" : `<option value="w:${i}">${p.name} (${p.faces.length})</option>`)
        .join("");
      const dbOpts = savedDBPeople
        .map(dbP => `<option value="db:${dbP.id}">[DB] ${dbP.name} (${dbP.faces.length})</option>`)
        .join("");

      moveTargetSelect.innerHTML = workingOpts + dbOpts;
      removeStrikeBtn.style.display = source === "person" ? "inline-block" : "none";
      detailModal.style.display = "flex";
    };

    window.closeDetailModal = function() {
      detailModal.style.display = "none";
      detailCtx = null;
    };

    moveTargetBtn.addEventListener("click", async () => {
      if (!detailCtx) return;
      const val = moveTargetSelect.value;
      if (!val) return;

      let face = null;
      if (detailCtx.source === "person") {
        const srcP = people[detailCtx.personIdx];
        const i = srcP.faces.findIndex(x => x.id === detailCtx.faceId);
        if (i >= 0) {
          [face] = srcP.faces.splice(i, 1);
          recalcWorkingGroup(detailCtx.personIdx);
        }
      } else {
        const i = unsureFaces.findIndex(x => x.id === detailCtx.faceId);
        if (i >= 0) [face] = unsureFaces.splice(i, 1);
      }

      if (face) {
        if (val.startsWith("db:")) {
          const dbId = val.slice(3);
          const dbP = savedDBPeople.find(d => d.id === dbId);
          if (dbP) {
            face.mergedToSavedDB = true;
            dbP.faces.push({ id: face.id, url: face.url, fileName: face.fileName });
            if (face.embedding) dbP.embs.push(face.embedding);
            dbP.centroid = calcNormalizedCentroid(dbP.embs);
            await persistSavedPerson(dbP);
          }
        } else if (val.startsWith("w:")) {
          const targetIdx = parseInt(val.slice(2), 10);
          if (people[targetIdx]) {
            people[targetIdx].faces.push(face);
            if (face.embedding) people[targetIdx].embs.push(face.embedding);
            people[targetIdx].centroid = calcNormalizedCentroid(people[targetIdx].embs);
          }
        }
      }

      closeDetailModal();
      renderWorkingUI();
      updateSummaryStatus();
    });

    removeStrikeBtn.addEventListener("click", () => {
      if (!detailCtx || detailCtx.source !== "person") return;
      const { personIdx, faceId } = detailCtx;
      closeDetailModal();
      window.proposeReassignOnDelete(personIdx, faceId);
    });
  </script>
</body>
