<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Sorter — MediaPipe Tasks Vision & FaceAPI (iPad M1+)</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
  <script type="module">
    import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
    window.__MP_VISION__ = { FilesetResolver, FaceLandmarker };
  </script>
  <style>
    :root {
      --bg: #eef1f5;
      --card: #ffffff;
      --text: #18202c;
      --muted: #5c6778;
      --accent: #0f62fe;
      --accent-soft: #e6efff;
      --danger: #c62828;
      --warn: #b45309;
      --border: #dfe4ec;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    h1 { font-size: 17px; margin: 0; font-weight: 700; }
    .badge-model {
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 999px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    input[type="file"] {
      font-size: 13px;
      width: 100%;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { background: #aeb8c7; cursor: not-allowed; }
    .btn-ghost {
      background: #f2f4f8;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sm { padding: 5px 8px; font-size: 11.5px; border-radius: 7px; }
    .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
    .meta-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-row label { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
    input[type="range"] { width: 120px; }
    #status { font-size: 12.5px; font-weight: 600; color: var(--accent); }
    #status.err { color: var(--danger); }

    /* Lưới 2 cột: mỗi người chiếm đúng 1/2 chiều rộng màn hình */
    .people-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: start;
    }
    .person-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      min-width: 0;
    }
    .person-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid var(--accent);
    }
    /* Khung tên gọn, không dài */
    .name-compact {
      width: 76px;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .cnt-pill {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }
    .merge-mini {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .merge-mini select {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fafbfc;
    }
    .faces-subgrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }
    .face-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 7px;
      overflow: hidden;
      background: #e9edf3;
    }
    .face-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }
    .del-x {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(20, 24, 30, 0.72);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }
    .strike-tag {
      position: absolute;
      bottom: 2px;
      left: 2px;
      font-size: 9.5px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 1px 4px;
      border-radius: 4px;
      pointer-events: none;
    }

    /* Khu vực Unsure tách riêng phía dưới */
    .unsure-panel {
      margin-top: 14px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .unsure-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .unsure-title { font-size: 13.5px; font-weight: 700; color: var(--warn); }
    .unsure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 6px;
    }

    /* Modal xem nhanh & chuyển nhóm */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(12, 16, 22, 0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-box {
      background: #fff;
      color: var(--text);
      border-radius: 14px;
      padding: 12px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-box img {
      width: 100%;
      max-height: 52vh;
      object-fit: contain;
      border-radius: 10px;
      background: #111;
    }
    .modal-info { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .modal-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title-row">
      <h1>Face Sorter — iPad M1+</h1>
      <span class="badge-model">MediaPipe Tasks Vision + FaceAPI</span>
    </div>
    <div class="controls-grid">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <button id="runBtn" class="btn" disabled>Đang tải...</button>
    </div>
    <div class="meta-row">
      <label>Ngưỡng khớp: <span id="thLabel">0.46</span>
        <input type="range" id="threshold" min="0.34" max="0.56" step="0.01" value="0.46" />
      </label>
      <label>Góc nghiêng tối đa: <span id="yawLabel">38°</span>
        <input type="range" id="maxYaw" min="20" max="55" step="1" value="38" />
      </label>
      <span id="status">Đang khởi tạo mô hình...</span>
    </div>
  </div>

  <div id="peopleGrid" class="people-grid"></div>

  <div class="unsure-panel">
    <div class="unsure-head">
      <div class="unsure-title">Unsure (<span id="unsureCount">0</span>) — Mặt bị xoá ≥ 3 lần hoặc chưa nhận diện rõ</div>
      <button id="recheckUnsureBtn" class="btn btn-sm btn-ghost">Kiểm tra lại bằng mô hình khác</button>
    </div>
    <div id="unsureGrid" class="unsure-grid"></div>
  </div>

  <div id="modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img id="modalImg" src="" alt="" />
      <div id="modalInfo" class="modal-info"></div>
      <div class="modal-actions">
        <select id="moveTargetSelect"></select>
        <button id="moveTargetBtn" class="btn btn-sm">Chuyển người</button>
        <button id="removeStrikeBtn" class="btn btn-sm btn-danger">Xoá khỏi người (loại trừ)</button>
        <button class="btn btn-sm btn-ghost" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  </div>

  <script type="module">
    const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
    const MP_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
    const MP_WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

    const fileInput = document.getElementById("fileInput");
    const runBtn = document.getElementById("runBtn");
    const statusEl = document.getElementById("status");
    const thresholdEl = document.getElementById("threshold");
    const thLabel = document.getElementById("thLabel");
    const maxYawEl = document.getElementById("maxYaw");
    const yawLabel = document.getElementById("yawLabel");
    const peopleGrid = document.getElementById("peopleGrid");
    const unsureGrid = document.getElementById("unsureGrid");
    const unsureCountEl = document.getElementById("unsureCount");
    const recheckUnsureBtn = document.getElementById("recheckUnsureBtn");

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const modalInfo = document.getElementById("modalInfo");
    const moveTargetSelect = document.getElementById("moveTargetSelect");
    const moveTargetBtn = document.getElementById("moveTargetBtn");
    const removeStrikeBtn = document.getElementById("removeStrikeBtn");

    let faceLandmarker = null;
    let allFaces = [];      // Danh sách mặt đã crop (mỗi mặt chỉ thuộc tối đa 1 người hoặc unsure)
    let people = [];        // [{ id, name, faces: [] }]
    let unsureFaces = [];   // Mặt bị xoá >= 3 lần hoặc không nhận diện được
    let modalCtx = null;    // { source: "person" | "unsure", personIdx, faceId }

    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.className = isErr ? "err" : "";
    }

    async function initModels() {
      try {
        // Đợi face-api và MediaPipe Tasks Vision sẵn sàng
        let waitCount = 0;
        while ((!window.faceapi || !window.__MP_VISION__) && waitCount < 80) {
          await new Promise(r => setTimeout(r, 100));
          waitCount++;
        }
        if (!window.faceapi || !window.__MP_VISION__) {
          throw new Error("Không tải được thư viện AI.");
        }

        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);

        const { FilesetResolver, FaceLandmarker } = window.__MP_VISION__;
        const vision = await FilesetResolver.forVisionTasks(MP_WASM_URL);
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MP_MODEL_URL, delegate: "GPU" },
          runningMode: "IMAGE",
          numFaces: 12,
          outputFacialTransformationMatrixes: true
        });

        runBtn.disabled = false;
        runBtn.textContent = "Quét (10-20 ảnh)";
        setStatus("Sẵn sàng trên iPad M1+.");
      } catch (err) {
        setStatus("Lỗi tải mô hình: " + err.message, true);
      }
    }

    initModels();

    thresholdEl.addEventListener("input", () => {
      thLabel.textContent = parseFloat(thresholdEl.value).toFixed(2);
      if (allFaces.length > 0) clusterExclusive();
    });

    maxYawEl.addEventListener("input", () => {
      yawLabel.textContent = `${maxYawEl.value}°`;
      if (allFaces.length > 0) clusterExclusive();
    });

    // Ước lượng góc quay ngang (yaw) từ ma trận biến đổi 4x4 của MediaPipe FaceLandmarker
    function estimateYawDegFromMatrix(matrixData) {
      if (!matrixData || matrixData.length < 16) return 0;
      // Ma trận column-major: cột 2 (index 8, 9, 10) là trục Z hướng ra trước
      const z0 = matrixData[8];
      const z2 = matrixData[10];
      const rad = Math.atan2(z0, z2);
      return Math.abs((rad * 180) / Math.PI);
    }

    // Đọc ảnh vào canvas và tự giải phóng ảnh gốc
    function fileToCanvas(file, maxDim = 1500) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const c = document.createElement("canvas");
          c.width = width;
          c.height = height;
          c.getContext("2d").drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);
          resolve(c);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Lỗi đọc ảnh"));
        };
        img.src = url;
      });
    }

    // Crop chặt không lấn sang mặt người khác: thu hẹp khung dựa theo khoảng cách tới các mặt lân cận
    function cropTightNonOverlapping(sourceCanvas, box, allBoxes, outSize = 240) {
      const cx = box.x + box.width / 2;
      const cy = box.y + box.height / 2;
      let pad = Math.round(Math.max(box.width, box.height) * 0.16);

      // Tính khoảng cách rìa tối đa để không lấn vào hộp khuôn mặt khác
      for (const other of allBoxes) {
        if (other === box) continue;
        const ox1 = other.x;
        const oy1 = other.y;
        const ox2 = other.x + other.width;
        const oy2 = other.y + other.height;
        const dx = Math.max(ox1 - (box.x + box.width), box.x - ox2, 0);
        const dy = Math.max(oy1 - (box.y + box.height), box.y - oy2, 0);
        const dist = Math.hypot(dx, dy);
        if (dist < pad * 2) {
          pad = Math.max(4, Math.floor(dist / 2) - 2);
        }
      }

      const x = Math.max(0, Math.round(box.x - pad));
      const y = Math.max(0, Math.round(box.y - pad));
      const w = Math.min(sourceCanvas.width - x, Math.round(box.width + pad * 2));
      const h = Math.min(sourceCanvas.height - y, Math.round(box.height + pad * 2));

      const out = document.createElement("canvas");
      out.width = outSize;
      out.height = outSize;
      out.getContext("2d").drawImage(sourceCanvas, x, y, w, h, 0, 0, outSize, outSize);
      const dataUrl = out.toDataURL("image/jpeg", 0.9);
      out.width = 0;
      out.height = 0;
      return dataUrl;
    }

    // Crop theo bounding box chuẩn hóa [0..1] từ MediaPipe FaceLandmarker
    function cropFromNormalizedBox(sourceCanvas, nBox, outSize = 240) {
      const box = {
        x: nBox.originX * sourceCanvas.width,
        y: nBox.originY * sourceCanvas.height,
        width: nBox.width * sourceCanvas.width,
        height: nBox.height * sourceCanvas.height
      };
      return cropTightNonOverlapping(sourceCanvas, box, [box], outSize);
    }

    runBtn.addEventListener("click", async () => {
      const files = Array.from(fileInput.files || []);
      if (!files.length) {
        setStatus("Hãy chọn 10-20 ảnh trước.", true);
        return;
      }
      if (files.length > 25) {
        setStatus("Khuyến nghị chọn 10-20 ảnh mỗi lượt trên iPad để tối ưu tốc độ.", true);
      }

      runBtn.disabled = true;
      allFaces = [];
      people = [];
      unsureFaces = [];
      let idSeq = 0;

      for (let i = 0; i < files.length; i++) {
        setStatus(`Đang quét ảnh ${i + 1}/${files.length}...`);
        await new Promise(r => setTimeout(r, 10));

        try {
          const canvas = await fileToCanvas(files[i], 1500);

          // 1) Dùng MediaPipe FaceLandmarker (tasks-vision) đo góc yaw từng mặt
          const mpRes = faceLandmarker ? faceLandmarker.detect(canvas) : null;
          const yawList = [];
          if (mpRes && mpRes.facialTransformationMatrixes) {
            for (const mat of mpRes.facialTransformationMatrixes) {
              yawList.push(estimateYawDegFromMatrix(mat.data));
            }
          }

          // 2) Dùng FaceAPI dò mặt + landmark + descriptor 128D
          const dets = await faceapi
            .detectAllFaces(canvas, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.55 }))
            .withFaceLandmarks()
            .withFaceDescriptors();

          const boxes = dets.map(d => d.detection.box);
          const baseName = files[i].name.replace(/\.[^.]+$/, "");

          if (!dets.length) {
            // Nếu FaceAPI không thấy nhưng MediaPipe thấy mặt -> đưa vào Unsure kèm ảnh đã crop
            if (mpRes && mpRes.faceLandmarks && mpRes.faceLandmarks.length) {
              mpRes.faceLandmarks.forEach((lms, k) => {
                let minX = 1, minY = 1, maxX = 0, maxY = 0;
                for (const pt of lms) {
                  if (pt.x < minX) minX = pt.x;
                  if (pt.y < minY) minY = pt.y;
                  if (pt.x > maxX) maxX = pt.x;
                  if (pt.y > maxY) maxY = pt.y;
                }
                idSeq++;
                unsureFaces.push({
                  id: `f_${idSeq}`,
                  url: cropFromNormalizedBox(canvas, {
                    originX: minX,
                    originY: minY,
                    width: Math.max(0.05, maxX - minX),
                    height: Math.max(0.05, maxY - minY)
                  }),
                  fileName: `${baseName}_mp_${k + 1}.jpg`,
                  descriptor: null,
                  score: 0.4,
                  yaw: yawList[k] || 0,
                  strikes: 0,
                  excludedIds: new Set(),
                  reason: "Không trích xuất được vector đặc trưng chuẩn"
                });
              });
            }
          } else {
            dets.forEach((d, idx) => {
              const b = d.detection.box;
              if (b.width < 42 || b.height < 42) return;
              idSeq++;
              const faceUrl = cropTightNonOverlapping(canvas, b, boxes, 240);
              const yaw = yawList[idx] ?? estimateYawFrom68(d.landmarks);
              allFaces.push({
                id: `f_${idSeq}`,
                url: faceUrl,
                fileName: `${baseName}_m${idx + 1}.jpg`,
                descriptor: d.descriptor,
                score: d.detection.score,
                yaw,
                strikes: 0,
                excludedIds: new Set(),
                reason: ""
              });
            });
          }

          canvas.width = 0;
          canvas.height = 0;
        } catch (e) {
          console.warn(e);
        }
      }

      clusterExclusive();
      runBtn.disabled = false;
      setStatus(`Xong ${files.length} ảnh • ${people.length} người • ${unsureFaces.length} unsure.`);
    });

    // Ước lượng góc nghiêng dự phòng từ 68 điểm mốc nếu thiếu ma trận MP
    function estimateYawFrom68(landmarks) {
      const nose = landmarks.getNose()[3];
      const leftEye = landmarks.getLeftEye()[0];
      const rightEye = landmarks.getRightEye()[3];
      if (!nose || !leftEye || !rightEye) return 0;
      const dLeft = Math.hypot(nose.x - leftEye.x, nose.y - leftEye.y);
      const dRight = Math.hypot(nose.x - rightEye.x, nose.y - rightEye.y);
      const ratio = (dLeft - dRight) / Math.max(1, dLeft + dRight);
      return Math.min(75, Math.abs(ratio) * 140);
    }

    function calcCentroid(descs) {
      const c = new Float32Array(128);
      for (const v of descs) {
        for (let i = 0; i < 128; i++) c[i] += v[i];
      }
      for (let i = 0; i < 128; i++) c[i] /= descs.length;
      return c;
    }

    // Gom nhóm độc quyền: lọc mặt nghiêng quá góc maxYaw vào Unsure, mỗi mặt chỉ thuộc 1 người
    function clusterExclusive() {
      const th = parseFloat(thresholdEl.value);
      const maxYaw = parseFloat(maxYawEl.value);

      // Giữ lại các mặt đã bị đưa vào unsure do xoá >= 3 lần
      const permanentUnsure = unsureFaces.filter(f => f.strikes >= 3);
      unsureFaces = [...permanentUnsure];
      people = [];

      const candidates = [];
      for (const f of allFaces) {
        if (f.strikes >= 3) continue;
        if (!f.descriptor) {
          unsureFaces.push({ ...f, reason: "Thiếu đặc trưng" });
          continue;
        }
        // Mặt nghiêng quá góc cho phép dễ gom nhầm -> đưa vào Unsure để kiểm tra riêng
        if (f.yaw > maxYaw) {
          unsureFaces.push({ ...f, reason: `Nghiêng ~${Math.round(f.yaw)}° > ${maxYaw}°` });
          continue;
        }
        candidates.push(f);
      }

      candidates.sort((a, b) => b.score - a.score);
      const used = new Set();

      for (const f of candidates) {
        if (used.has(f.id)) continue;

        let bestIdx = -1;
        let bestDist = th;

        for (let i = 0; i < people.length; i++) {
          if (f.excludedIds.has(people[i].id)) continue;
          const distC = faceapi.euclideanDistance(f.descriptor, people[i].centroid);
          const distA = faceapi.euclideanDistance(f.descriptor, people[i].anchor);
          const dist = Math.max(distC, distA * 0.96);
          if (dist < bestDist) {
            bestDist = dist;
            bestIdx = i;
          }
        }

        if (bestIdx >= 0) {
          used.add(f.id);
          people[bestIdx].faces.push(f);
          people[bestIdx].descs.push(f.descriptor);
          people[bestIdx].centroid = calcCentroid(people[bestIdx].descs);
        } else {
          used.add(f.id);
          people.push({
            id: `p_${people.length + 1}_${Math.random().toString(36).slice(2, 6)}`,
            name: `N${people.length + 1}`,
            anchor: f.descriptor,
            centroid: f.descriptor,
            descs: [f.descriptor],
            faces: [f]
          });
        }
      }

      people.sort((a, b) => b.faces.length - a.faces.length);
      people.forEach((p, i) => {
        if (/^N\d+$/.test(p.name)) p.name = `N${i + 1}`;
      });

      renderUI();
    }

    // Phương pháp loại trừ: xoá mặt khỏi người hiện tại, thêm người hiện tại vào excludedIds, tự động gom vào người giống hơn còn lại
    window.excludeAndReassign = function(personIdx, faceId) {
      const p = people[personIdx];
      if (!p) return;
      const idx = p.faces.findIndex(x => x.id === faceId);
      if (idx < 0) return;

      const [face] = p.faces.splice(idx, 1);
      face.strikes = (face.strikes || 0) + 1;
      face.excludedIds.add(p.id);

      // Cập nhật lại centroid của người bị xoá
      p.descs = p.faces.map(x => x.descriptor);
      if (p.faces.length === 0) {
        people.splice(personIdx, 1);
      } else {
        p.centroid = calcCentroid(p.descs);
      }

      // Nếu bị xoá >= 3 lần -> đưa thẳng vào Unsure
      if (face.strikes >= 3) {
        face.reason = "Bị xoá khỏi nhóm ≥ 3 lần";
        unsureFaces.push(face);
        setStatus(`Mặt đã bị xoá ${face.strikes} lần -> chuyển vào Unsure.`);
        renderUI();
        return;
      }

      // Tìm người khác (không nằm trong excludedIds) giống nhất bằng phương pháp loại trừ
      const baseTh = parseFloat(thresholdEl.value);
      let nextIdx = -1;
      let minDist = baseTh + 0.06; // Nới nhẹ để tìm ứng viên gần nhất sau khi loại trừ

      for (let i = 0; i < people.length; i++) {
        if (face.excludedIds.has(people[i].id)) continue;
        const d = faceapi.euclideanDistance(face.descriptor, people[i].centroid);
        if (d < minDist) {
          minDist = d;
          nextIdx = i;
        }
      }

      if (nextIdx >= 0) {
        people[nextIdx].faces.push(face);
        people[nextIdx].descs.push(face.descriptor);
        people[nextIdx].centroid = calcCentroid(people[nextIdx].descs);
        setStatus(`Đã loại trừ khỏi "${p.name}" và tự động chuyển sang "${people[nextIdx].name}".`);
      } else {
        // Không khớp người nào khác -> đưa vào Unsure
        face.reason = "Không khớp người khác sau loại trừ";
        unsureFaces.push(face);
        setStatus(`Đã loại trừ khỏi "${p.name}", chưa tìm thấy người khớp -> đưa vào Unsure.`);
      }

      renderUI();
    };

    function mergePerson(fromIdx, toIdx) {
      if (fromIdx === toIdx || !people[fromIdx] || !people[toIdx]) return;
      const src = people[fromIdx];
      const dst = people[toIdx];
      const seen = new Set(dst.faces.map(f => f.id));

      for (const f of src.faces) {
        if (!seen.has(f.id)) {
          seen.add(f.id);
          dst.faces.push(f);
          dst.descs.push(f.descriptor);
        }
      }
      dst.centroid = calcCentroid(dst.descs);
      people.splice(fromIdx, 1);
      setStatus(`Đã gộp ${src.name} vào ${dst.name}.`);
      renderUI();
    }

    // Kiểm tra lại nhóm Unsure bằng mô hình/cấu hình khác (ngưỡng nới hơn + kiểm tra lại toàn bộ người hiện có)
    recheckUnsureBtn.addEventListener("click", async () => {
      if (!unsureFaces.length) {
        setStatus("Không có mặt nào trong Unsure.");
        return;
      }
      recheckUnsureBtn.disabled = true;
      setStatus("Đang kiểm tra lại Unsure với ngưỡng nới lỏng hơn...");

      const stillUnsure = [];
      const relaxedTh = Math.min(0.62, parseFloat(thresholdEl.value) + 0.08);

      for (const f of unsureFaces) {
        if (f.strikes >= 3) {
          stillUnsure.push(f);
          continue;
        }
        // Thử trích xuất lại descriptor bằng FaceAPI nếu mặt đang thiếu descriptor
        if (!f.descriptor) {
          try {
            const im = await new Promise((res, rej) => {
              const i = new Image();
              i.onload = () => res(i);
              i.onerror = rej;
              i.src = f.url;
            });
            const det = await faceapi
              .detectSingleFace(im, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.35 }))
              .withFaceLandmarks()
              .withFaceDescriptor();
            if (det && det.descriptor) f.descriptor = det.descriptor;
          } catch (_) {}
        }

        if (!f.descriptor || !people.length) {
          stillUnsure.push(f);
          continue;
        }

        let bestIdx = -1;
        let bestD = relaxedTh;
        for (let i = 0; i < people.length; i++) {
          if (f.excludedIds && f.excludedIds.has(people[i].id)) continue;
          const d = faceapi.euclideanDistance(f.descriptor, people[i].centroid);
          if (d < bestD) {
            bestD = d;
            bestIdx = i;
          }
        }

        if (bestIdx >= 0) {
          people[bestIdx].faces.push(f);
          people[bestIdx].descs.push(f.descriptor);
          people[bestIdx].centroid = calcCentroid(people[bestIdx].descs);
        } else {
          stillUnsure.push(f);
        }
      }

      unsureFaces = stillUnsure;
      recheckUnsureBtn.disabled = false;
      setStatus(`Kiểm tra Unsure xong. Còn lại ${unsureFaces.length} mặt.`);
      renderUI();
    });

    function renderUI() {
      peopleGrid.innerHTML = "";

      people.forEach((p, idx) => {
        const card = document.createElement("div");
        card.className = "person-card";

        const opts = people
          .map((other, oIdx) => oIdx === idx ? "" : `<option value="${oIdx}">→ ${other.name}</option>`)
          .join("");

        card.innerHTML = `
          <div class="person-head">
            <img class="avatar" src="${p.faces[0]?.url || ""}" />
            <input class="name-compact" value="${p.name}" />
            <span class="cnt-pill">${p.faces.length}</span>
          </div>
          <div class="merge-mini">
            <select class="m-sel">${opts || `<option value="">—</option>`}</select>
            <button class="btn btn-sm btn-ghost m-btn" ${opts ? "" : "disabled"}>Gộp</button>
          </div>
          <div class="faces-subgrid"></div>
        `;

        card.querySelector(".name-compact").addEventListener("change", (e) => {
          p.name = e.target.value.trim() || `N${idx + 1}`;
          renderUI();
        });

        card.querySelector(".m-btn").addEventListener("click", () => {
          const t = parseInt(card.querySelector(".m-sel").value, 10);
          if (!Number.isNaN(t)) mergePerson(idx, t);
        });

        const sub = card.querySelector(".faces-subgrid");
        p.faces.forEach(f => {
          const item = document.createElement("div");
          item.className = "face-item";
          item.innerHTML = `
            <img src="${f.url}" />
            <button class="del-x" title="Xoá & tự chuyển người">×</button>
            ${f.strikes > 0 ? `<span class="strike-tag">${f.strikes}/3</span>` : ""}
          `;
          item.querySelector("img").onclick = () => openModal("person", idx, f.id);
          item.querySelector(".del-x").onclick = (ev) => {
            ev.stopPropagation();
            window.excludeAndReassign(idx, f.id);
          };
          sub.appendChild(item);
        });

        peopleGrid.appendChild(card);
      });

      unsureCountEl.textContent = unsureFaces.length;
      unsureGrid.innerHTML = "";
      unsureFaces.forEach(f => {
        const item = document.createElement("div");
        item.className = "face-item";
        item.innerHTML = `
          <img src="${f.url}" />
          <span class="strike-tag">${f.strikes}/3</span>
        `;
        item.querySelector("img").onclick = () => openModal("unsure", -1, f.id);
        unsureGrid.appendChild(item);
      });
    }

    window.openModal = function(source, personIdx, faceId) {
      const face = source === "person"
        ? people[personIdx]?.faces.find(x => x.id === faceId)
        : unsureFaces.find(x => x.id === faceId);
      if (!face) return;

      modalCtx = { source, personIdx, faceId };
      modalImg.src = face.url;
      modalInfo.textContent = `File: ${face.fileName} • Góc nghiêng: ~${Math.round(face.yaw || 0)}° • Lượt xoá: ${face.strikes}/3 ${face.reason ? "• " + face.reason : ""}`;

      moveTargetSelect.innerHTML = people
        .map((p, i) => (source === "person" && i === personIdx) ? "" : `<option value="${i}">${p.name} (${p.faces.length})</option>`)
        .join("");

      removeStrikeBtn.style.display = source === "person" ? "inline-block" : "none";
      modal.style.display = "flex";
    };

    window.closeModal = function() {
      modal.style.display = "none";
      modalCtx = null;
    };

    moveTargetBtn.addEventListener("click", () => {
      if (!modalCtx) return;
      const targetIdx = parseInt(moveTargetSelect.value, 10);
      if (Number.isNaN(targetIdx) || !people[targetIdx]) return;

      let face = null;
      if (modalCtx.source === "person") {
        const srcP = people[modalCtx.personIdx];
        const i = srcP.faces.findIndex(x => x.id === modalCtx.faceId);
        if (i >= 0) {
          [face] = srcP.faces.splice(i, 1);
          srcP.descs = srcP.faces.map(x => x.descriptor);
          if (srcP.faces.length === 0) people.splice(modalCtx.personIdx, 1);
          else srcP.centroid = calcCentroid(srcP.descs);
        }
      } else {
        const i = unsureFaces.findIndex(x => x.id === modalCtx.faceId);
        if (i >= 0) [face] = unsureFaces.splice(i, 1);
      }

      if (face && face.descriptor) {
        // Cập nhật lại chỉ số nhóm đích sau khi có thể splice
        const safeIdx = Math.min(targetIdx, people.length - 1);
        people[safeIdx].faces.push(face);
        people[safeIdx].descs.push(face.descriptor);
        people[safeIdx].centroid = calcCentroid(people[safeIdx].descs);
      }
      closeModal();
      renderUI();
    });

    removeStrikeBtn.addEventListener("click", () => {
      if (!modalCtx || modalCtx.source !== "person") return;
      const { personIdx, faceId } = modalCtx;
      closeModal();
      window.excludeAndReassign(personIdx, faceId);
    });
  </script>
</body>
</html>
